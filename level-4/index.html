<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>De Onthulling — Level 4</title>
<style>
:root{--gold:#e6b84b;--gold2:#ffe38a;--bg:#000}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#fff;font-family:Georgia,'Times New Roman',serif}
button{font:inherit}
#app{position:fixed;inset:0;background:#000;overflow:hidden;isolation:isolate}
#stage{position:absolute;inset:0;background:#000;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none;background:#000;display:grid;place-items:center}
.scene.active{opacity:1}
.scene::before{content:"";position:absolute;inset:-5%;background:var(--bgimg) center/cover no-repeat;filter:blur(20px) brightness(.34) saturate(1.2);transform:scale(1.12);opacity:.78}
.scene img{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain;z-index:1;animation:ken 13s ease-in-out infinite alternate}
.scene.cover img{object-fit:cover}
.scene::after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 48%,transparent 35%,rgba(0,0,0,.28) 72%,rgba(0,0,0,.75) 100%);pointer-events:none}
@keyframes ken{from{transform:scale(1.005)}to{transform:scale(1.03)}}
#boot{position:absolute;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,#171005,#050302 35%,#000 74%);padding:24px}
#boot .auth{letter-spacing:.46em;color:var(--gold2);font-size:.72rem;margin-bottom:24px;text-shadow:0 0 18px #d99b37}
#boot h1{font-weight:400;font-size:clamp(3rem,11vw,7rem);letter-spacing:.07em;margin:0;color:#f4ca67;text-shadow:0 0 20px rgba(255,199,70,.35),0 0 60px rgba(183,105,0,.18)}
#boot p{letter-spacing:.38em;color:#c69337;font-size:.76rem}
.btn{padding:15px 29px;border:1px solid rgba(235,181,74,.85);border-radius:4px;background:rgba(38,18,0,.55);color:#ffe18b;letter-spacing:.18em;font-size:.76rem;cursor:pointer;box-shadow:0 0 28px rgba(230,168,49,.28),inset 0 0 18px rgba(255,212,111,.06);text-transform:uppercase}
#openLevel{margin-top:38px}
#startOverlay{position:absolute;inset:0;z-index:60;display:none;place-items:center;cursor:pointer}
#startOverlay.show{display:grid}
#startLevel{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);min-width:230px;box-shadow:0 0 42px rgba(239,176,45,.5),inset 0 0 22px rgba(255,218,120,.09)}
#loading{position:absolute;z-index:120;left:50%;bottom:3vh;transform:translateX(-50%);font:600 .65rem Arial,sans-serif;letter-spacing:.22em;color:rgba(255,219,132,.72);opacity:0;transition:.4s}
#loading.show{opacity:1}
#flash{position:absolute;inset:0;z-index:150;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,227,136,.85) 0,rgba(255,166,22,.28) 23%,transparent 52%)}
#flash.go{animation:flash .8s ease}
@keyframes flash{0%{opacity:0}10%{opacity:1}35%{opacity:.42}100%{opacity:0}}
#shake{position:absolute;inset:0;z-index:155;pointer-events:none}
#shake.s1{animation:sh1 .5s ease}#shake.s2{animation:sh2 .65s ease}#shake.s3{animation:sh3 .9s ease}
@keyframes sh1{15%{transform:translate(4px,-3px)}35%{transform:translate(-4px,2px)}100%{transform:none}}
@keyframes sh2{10%{transform:translate(8px,-6px)}25%{transform:translate(-8px,5px)}43%{transform:translate(5px,-3px)}100%{transform:none}}
@keyframes sh3{7%{transform:translate(16px,-11px) scale(1.015)}18%{transform:translate(-15px,10px)}30%{transform:translate(11px,-8px)}42%{transform:translate(-8px,5px)}55%{transform:translate(6px,-4px)}100%{transform:none}}
#error{position:absolute;z-index:200;inset:0;display:none;place-items:center;padding:28px;text-align:center;background:#000;color:#f6d377;line-height:1.7}
#error.show{display:grid}
@media(max-width:700px){.scene img{object-fit:cover}.scene.portrait img{object-fit:contain}#startLevel{top:66%}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="startOverlay" role="button" aria-label="Start Level 4"><button id="startLevel" class="btn">START LEVEL 4</button></div>
  <div id="flash"></div><div id="shake"></div>
  <div id="loading">BEELDEN WORDEN GELADEN…</div>
  <section id="boot">
    <div>
      <div class="auth">AUTHORIZED</div>
      <h1>DE ONTHULLING</h1>
      <p>LEVEL 4</p>
      <button id="openLevel" class="btn">OPEN LEVEL</button>
      <div style="margin-top:15px;font:12px Arial;color:#756a53;letter-spacing:.08em">Zet je geluid aan voor de volledige ervaring.</div>
    </div>
  </section>
  <div id="error"><div><h2>Level 4 kon niet starten</h2><p>Controleer of de map <b>assets</b> naast index.html staat en of <b>song.mp3</b> daarin aanwezig is.</p></div></div>
  <audio id="music" preload="auto" src="assets/song.mp3"></audio>
</div>
<script>
const AS='assets/';
const files=['p1','p2','p3','p4','p5','p6','p7','p8','p9','p10','p11','p12','p13','p14','p16','p17','p18','p20','p21','p22','p23','p32','p33'];
const stage=document.getElementById('stage'), boot=document.getElementById('boot'), startOverlay=document.getElementById('startOverlay'), startLevel=document.getElementById('startLevel'), music=document.getElementById('music'), flash=document.getElementById('flash'), shake=document.getElementById('shake'), loading=document.getElementById('loading'), errorBox=document.getElementById('error');
let audioCtx=null,current=null,raf=0,loaded=false;
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function osc(freq,dur,type='sine',gain=.12,delay=0){if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur=.5,gain=.18,delay=0,cut=1400){if(!audioCtx)return;const rate=audioCtx.sampleRate,b=audioCtx.createBuffer(1,Math.max(1,Math.floor(rate*dur)),rate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const src=audioCtx.createBufferSource(),lp=audioCtx.createBiquadFilter(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;src.buffer=b;lp.type='lowpass';lp.frequency.value=cut;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(lp).connect(g).connect(audioCtx.destination);src.start(t)}
function auth(n=1){osc(460+n*120,.22,'sine',.1);osc(900+n*160,.34,'triangle',.045,.05);noise(.12,.025,.02,3800)}
function access(){osc(300,.6,'sine',.15);osc(600,.75,'sine',.11,.08);osc(900,.9,'triangle',.07,.16);noise(.38,.08,.03,3600)}
function boom(n){const base=[62,48,38][n-1],g=[.34,.47,.62][n-1];osc(base,.9,'sine',g);osc(base*2,.5,'triangle',g*.32,.01);noise(.75,g*.62,0,850+n*280);noise(.22,g*.28,.01,6500);for(let i=0;i<5+n*3;i++)osc(900+Math.random()*2600,.06+Math.random()*.12,'square',.012+n*.004,Math.random()*.16);try{navigator.vibrate(n===1?[90]:n===2?[120,35,100]:[160,40,130,35,160])}catch(e){}shake.className='';void shake.offsetWidth;shake.classList.add('s'+n);flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
function clue(){noise(.95,.065,0,4600);osc(830,.9,'sine',.06,.1);osc(1240,.85,'sine',.045,.25);osc(1760,.8,'triangle',.03,.4)}
function imgPath(k){return AS+k+'.jpg'}
function preload(){loading.classList.add('show');return Promise.all(files.map(k=>new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(true);im.onerror=()=>resolve(false);im.src=imgPath(k)}))).then(r=>{loaded=r.some(Boolean);loading.classList.remove('show');return loaded})}
function show(k,{cover=true,portrait=false}={}){if(current===k)return;current=k;const olds=[...stage.querySelectorAll('.scene.active')];olds.forEach(x=>x.classList.remove('active'));let el=stage.querySelector(`[data-key="${k}"]`);if(!el){el=document.createElement('div');el.className='scene'+(cover?' cover':'')+(portrait?' portrait':'');el.dataset.key=k;el.style.setProperty('--bgimg',`url("${imgPath(k)}")`);const im=document.createElement('img');im.alt='';im.src=imgPath(k);el.appendChild(im);stage.appendChild(el)}el.style.display='grid';requestAnimationFrame(()=>el.classList.add('active'));setTimeout(()=>olds.forEach(x=>{if(!x.classList.contains('active'))x.style.display='none'}),1100)}
async function intro(){boot.style.display='none';if(!loaded)await preload();show('p1',{cover:false,portrait:true});auth(1);await sleep(1500);show('p2',{cover:false,portrait:true});auth(2);await sleep(1550);show('p3',{cover:false,portrait:true});access();await sleep(1700);show('p4',{cover:false,portrait:true});await sleep(180);boom(1);await sleep(1150);show('p5',{cover:false,portrait:true});await sleep(160);boom(2);await sleep(1200);show('p6',{cover:false,portrait:true});await sleep(140);boom(3);await sleep(1400);show('p7',{cover:false,portrait:true});await sleep(100);boom(3);await sleep(1100);show('p8',{cover:true});clue();await sleep(4100);show('p9',{cover:true});startOverlay.classList.add('show')}
document.getElementById('openLevel').addEventListener('click',()=>{ensureAudio();preload();intro()},{once:true});
const scenes=[[0,'p10'],[23,'p11'],[35,'p12'],[39,'p13'],[58,'p14'],[88,'p16'],[107,'p17'],[118,'p18'],[147,'p20'],[155,'p21'],[175,'p22'],[204,'p23'],[278,'p32'],[323,'p33']];
function keyAt(t){let k='p10';for(const [s,x] of scenes){if(t>=s)k=x;else break}return k}
function tick(){const t=music.currentTime;show(keyAt(t),{cover:true});if(!music.paused&&!music.ended)raf=requestAnimationFrame(tick)}
async function startSong(e){if(e)e.stopPropagation();ensureAudio();startOverlay.classList.remove('show');show('p10',{cover:true});try{music.currentTime=0;await music.play();cancelAnimationFrame(raf);tick()}catch(err){console.error(err);startOverlay.classList.add('show');startLevel.textContent='TIK NOGMAALS OM TE STARTEN'}}
startLevel.addEventListener('click',startSong);startOverlay.addEventListener('click',startSong);
music.addEventListener('error',()=>errorBox.classList.add('show'));
music.addEventListener('ended',()=>cancelAnimationFrame(raf));
</script>
</body>
</html>
