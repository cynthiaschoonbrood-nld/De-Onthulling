<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>De Onthulling — Level 4</title>
<style>
:root{--g:#d8ad55;--g2:#ffe3a0;--g3:#8d5a10;--bg:#020202}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:30}
.screen.active{opacity:1;pointer-events:auto}
.gold{color:var(--g2);text-shadow:0 0 8px rgba(255,225,150,.9),0 0 26px rgba(216,173,85,.45),0 0 65px rgba(130,74,0,.25)}
.script{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-style:italic;font-weight:400}
.serif{font-family:Georgia,"Times New Roman",serif}
#fx{z-index:95}
.grain{position:absolute;inset:-20%;z-index:4;opacity:.028;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:4px 4px;animation:grain 9s steps(9) infinite;pointer-events:none}
.vignette{position:absolute;inset:0;z-index:94;pointer-events:none;box-shadow:inset 0 0 24vw #000}
@keyframes grain{to{transform:translate3d(2.5%,1.6%,0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(6px) scale(.985)}50%{transform:translateY(-10px) scale(1.018)}}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 18px rgba(230,177,72,.4));opacity:.3}50%{filter:drop-shadow(0 0 38px rgba(255,213,109,.9)) drop-shadow(0 0 85px rgba(149,83,5,.4));opacity:.52}}

/* 1 loading */
#boot{z-index:90;background:radial-gradient(circle at 50% 42%,#1a1205,#080603 32%,#000 72%)}
.load-title{font:500 clamp(2.2rem,8vw,5.1rem)/1.08 Georgia,serif;letter-spacing:.11em}
.load-shell{width:min(72vw,520px);height:4px;margin:30px auto 0;background:#21170a;border:1px solid rgba(216,173,85,.38);overflow:hidden}
#loadBar{height:100%;width:0;background:linear-gradient(90deg,#7a4b0d,var(--g2));box-shadow:0 0 20px rgba(255,225,154,.92);transition:width .22s ease}
#loadPct{margin-top:12px;font-size:.66rem;letter-spacing:.3em;color:#bb8c3d}

/* 2 authorized */
#auth{z-index:89;background:#000}
.authword{font:500 clamp(2.7rem,10vw,6.7rem) Georgia,serif;letter-spacing:.14em}
.waveform{display:flex;align-items:center;justify-content:center;gap:3px;width:min(78vw,590px);height:84px;margin:22px auto 8px}
.waveform i{width:2px;height:7px;background:linear-gradient(var(--g2),#7b4a09);box-shadow:0 0 9px rgba(255,216,118,.8);animation:wave .68s ease-in-out infinite}
.waveform i:nth-child(3n){animation-delay:-.23s}.waveform i:nth-child(2n){animation-delay:-.4s}.waveform i:nth-child(5n){animation-delay:-.55s}
.verify{font-size:.64rem;letter-spacing:.35em;color:#a7803d}
@keyframes wave{0%,100%{height:7px;opacity:.32}50%{height:62px;opacity:1}}

/* 3 toegang */
#access{z-index:88;background:#000}
.access-ring{width:152px;height:152px;border:1px solid rgba(255,218,132,.76);border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 32px rgba(216,173,85,.22),inset 0 0 24px rgba(216,173,85,.08)}
.access-ring:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(216,173,85,.22);animation:ringPulse 2s ease-in-out infinite}
.check{width:58px;height:31px;border-left:4px solid var(--g2);border-bottom:4px solid var(--g2);transform:rotate(-45deg) scale(.08);opacity:0;filter:drop-shadow(0 0 10px #e4b95f)}
.check.draw{animation:checkDraw .95s cubic-bezier(.2,.85,.2,1) forwards}
.access-text{margin-top:30px;font:500 clamp(1.25rem,4vw,2.35rem) Georgia,serif;letter-spacing:.15em;color:var(--g2);opacity:0}
.access-text.show{animation:fadeIn .7s forwards}
@keyframes checkDraw{to{transform:rotate(-45deg) scale(1);opacity:1}}
@keyframes ringPulse{50%{transform:scale(1.08);opacity:.35}}

/* 4 countdown */
#countdown{z-index:87;background:radial-gradient(circle at 50% 50%,rgba(138,82,5,.16),#000 50%)}
#count{font:500 clamp(10rem,45vw,24rem)/.7 Georgia,serif;color:var(--g2);text-shadow:0 0 30px rgba(255,226,160,.95),0 0 95px rgba(216,173,85,.58);opacity:0}
#count.hit{animation:countHit 1.12s cubic-bezier(.1,.85,.25,1)}
#countdown.impact1{animation:shake1 .56s ease}#countdown.impact2{animation:shake2 .7s ease}#countdown.impact3{animation:shake3 .86s ease}
@keyframes countHit{0%{opacity:0;filter:blur(18px);transform:scale(.42)}30%{opacity:1;filter:blur(0);transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
@keyframes shake1{15%{transform:translate(3px,-2px)}35%{transform:translate(-3px,2px)}100%{transform:none}}
@keyframes shake2{10%{transform:translate(8px,-5px) scale(1.02)}25%{transform:translate(-8px,5px)}45%{transform:translate(5px,-3px)}100%{transform:none}}
@keyframes shake3{8%{transform:translate(14px,-10px) scale(1.05)}20%{transform:translate(-13px,9px)}34%{transform:translate(10px,-6px)}48%{transform:translate(-7px,4px)}100%{transform:none}}

/* 5 clue */
#clue{z-index:86;background:radial-gradient(circle at 50% 48%,rgba(125,72,4,.14),#000 58%)}
.heart-stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.heart-stage:before{content:"";position:absolute;width:72vmin;height:72vmin;border-radius:50%;background:radial-gradient(circle,rgba(227,170,65,.18),rgba(94,53,0,.06) 40%,transparent 70%);filter:blur(18px);animation:aura 4.8s ease-in-out infinite}
.heart-img{width:min(78vw,830px);max-height:80vh;object-fit:contain;mix-blend-mode:screen;animation:float 5.2s ease-in-out infinite,pulseGlow 4.2s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.14);opacity:.62}}
.clue-copy{position:relative;z-index:3;font:italic 400 clamp(1.7rem,5vw,3.9rem)/1.34 "Palatino Linotype",Georgia,serif;color:#f3cf78;text-shadow:0 0 10px #000,0 0 28px rgba(255,215,120,.58);opacity:0;transform:translateY(12px)}
.clue-copy.show{animation:clueIn 1.4s ease forwards}
@keyframes clueIn{to{opacity:1;transform:none}}
#startLevel{position:relative;z-index:4;margin-top:32px;padding:15px 30px;border:1px solid rgba(255,219,132,.78);background:rgba(51,29,3,.42);color:var(--g2);letter-spacing:.15em;border-radius:4px;box-shadow:0 0 28px rgba(216,173,85,.19),inset 0 0 18px rgba(216,173,85,.05);cursor:pointer;opacity:0;pointer-events:none;transition:.8s}
#startLevel.show{opacity:1;pointer-events:auto}
#startLevel:hover{background:rgba(95,58,8,.35);box-shadow:0 0 44px rgba(216,173,85,.36)}

/* 6 movie */
#cinema{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .8s ease}
#cinema.active{opacity:1;pointer-events:auto}
#corridor,#stage{position:absolute;inset:0;overflow:hidden;transition:opacity 1.2s ease}
#corridor{opacity:1;background:radial-gradient(ellipse at 50% 54%,rgba(58,39,15,.27),rgba(9,8,7,.9) 40%,#010101 74%)}
#corridor.fade{opacity:0}
.wall{position:absolute;top:0;bottom:0;width:48%;background:
repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.025) 32px 33px),
repeating-linear-gradient(90deg,#0a0907 0 76px,#14110c 77px 79px,#070605 80px 82px);filter:brightness(.73)}
.wall.left{left:-17%;transform:skewY(5deg)}.wall.right{right:-17%;transform:skewY(-5deg)}
.floor{position:absolute;left:-6%;right:-6%;bottom:-2%;height:42%;background:
linear-gradient(to top,rgba(0,0,0,.02),rgba(0,0,0,.76)),
repeating-linear-gradient(90deg,transparent 0 115px,rgba(193,145,60,.08) 116px 118px),
repeating-linear-gradient(0deg,#0c0b09 0 52px,#15120d 53px 55px);
transform:perspective(470px) rotateX(59deg);transform-origin:bottom center}
.lantern{position:absolute;top:28%;width:17px;height:44px;background:linear-gradient(#47310e,#ffd26a 40%,#724a0b);border:2px solid #2b2115;border-radius:45% 45% 35% 35%;box-shadow:0 0 12px #e5a83d,0 0 36px rgba(225,160,44,.5)}
.l1{left:13%}.l2{left:27%;transform:scale(.73)}.l3{right:13%}.l4{right:27%;transform:scale(.73)}
.lantern:before{content:"";position:absolute;width:2px;height:28px;background:#332515;left:50%;bottom:100%}
.door-zone{position:absolute;left:50%;top:48%;width:min(35vw,340px);height:min(57vh,520px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 15px rgba(0,0,0,.9))}
.arch{position:absolute;inset:-6% -9% -2%;border:9px solid #2c271f;border-bottom-width:14px;border-radius:47% 47% 4% 4%/18% 18% 3% 3%;box-shadow:inset 0 0 20px #000,0 0 0 3px #0c0b09}
.door-light{position:absolute;left:50%;bottom:-3%;width:75%;height:11%;transform:translateX(-50%);background:radial-gradient(ellipse,#ffe18c,rgba(232,169,58,.74) 36%,transparent 73%);filter:blur(8px);opacity:0;transition:opacity 4s ease}
.door-light.grow{opacity:1}
.door-panel{position:absolute;top:0;bottom:0;width:50%;background:
linear-gradient(90deg,rgba(255,255,255,.04),transparent 20% 80%,rgba(0,0,0,.3)),
repeating-linear-gradient(0deg,#2c2016 0 23%,#17120d 23.5% 24%,#4e3720 24.5% 25%);
border:7px solid #1f1c17;box-shadow:inset 0 0 0 4px #50412e,inset 0 0 30px #080604;transform-style:preserve-3d;transition:transform 2.7s cubic-bezier(.2,.7,.13,1)}
.door-panel:before{content:"";position:absolute;inset:5% 8%;background:
repeating-linear-gradient(0deg,transparent 0 23%,rgba(46,42,35,.9) 23.4% 25%),
repeating-linear-gradient(90deg,transparent 0 46%,rgba(56,48,36,.95) 47% 53%,transparent 54%),
radial-gradient(circle at 12% 9%,#85704f 0 2px,#16130f 3px 5px,transparent 6px);
background-size:auto,auto,42px 42px;box-shadow:inset 0 0 0 3px #0a0908}
.door-panel.left{left:0;transform-origin:left center}.door-panel.right{right:0;transform-origin:right center}
.door-panel.open.left{transform:rotateY(-98deg)}.door-panel.open.right{transform:rotateY(98deg)}
.beyond{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#fff7c8,#ffd76e 12%,rgba(255,189,56,.74) 29%,rgba(109,56,2,.15) 53%,transparent 73%);opacity:0;transition:opacity 2.2s}
.beyond.show{opacity:1}
#corridor.walk{animation:walkIn 35s linear forwards}
@keyframes walkIn{from{transform:scale(1)}to{transform:scale(1.14)}}

/* stage from storyboard */
#stage{opacity:0;background:
radial-gradient(ellipse at 50% 42%,rgba(110,67,4,.18),transparent 44%),
linear-gradient(#030303,#000)}
#stage.show{opacity:1}
.stage-haze{position:absolute;inset:0;background:
radial-gradient(circle at 50% 55%,rgba(178,112,15,.13),transparent 35%),
radial-gradient(circle at 20% 35%,rgba(151,91,8,.08),transparent 25%),
radial-gradient(circle at 80% 35%,rgba(151,91,8,.08),transparent 25%);filter:blur(12px);animation:haze 7s ease-in-out infinite alternate}
@keyframes haze{to{transform:scale(1.05);opacity:.7}}
.crowd{position:absolute;left:-2%;right:-2%;bottom:-2%;height:23%;background:
radial-gradient(circle at 2% 62%,#060606 0 11px,transparent 12px),
radial-gradient(circle at 8% 54%,#070707 0 10px,transparent 11px),
radial-gradient(circle at 14% 64%,#050505 0 12px,transparent 13px),
radial-gradient(circle at 21% 56%,#060606 0 10px,transparent 11px),
radial-gradient(circle at 29% 65%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 37% 57%,#060606 0 11px,transparent 12px),
radial-gradient(circle at 46% 63%,#050505 0 12px,transparent 13px),
radial-gradient(circle at 55% 54%,#060606 0 11px,transparent 12px),
radial-gradient(circle at 63% 66%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 72% 55%,#060606 0 10px,transparent 11px),
radial-gradient(circle at 81% 64%,#050505 0 12px,transparent 13px),
radial-gradient(circle at 90% 55%,#060606 0 10px,transparent 11px),
radial-gradient(circle at 97% 64%,#050505 0 12px,transparent 13px),
linear-gradient(transparent 0 35%,#040404 36% 100%);
opacity:.98;filter:drop-shadow(0 -10px 20px #000)}
.beam{position:absolute;top:-15%;width:12%;height:120%;background:linear-gradient(to bottom,rgba(255,218,111,.5),rgba(216,148,32,.09) 48%,transparent 80%);filter:blur(5px);transform-origin:top center;animation:sweep 5s ease-in-out infinite alternate}
.b1{left:10%;transform:rotate(19deg)}.b2{left:31%;animation-delay:-1.1s;transform:rotate(7deg)}.b3{right:31%;animation-delay:-2.2s;transform:rotate(-7deg)}.b4{right:10%;animation-delay:-3s;transform:rotate(-19deg)}
@keyframes sweep{to{transform:rotate(-14deg) translateX(4vw)}}
.stage-heart{position:absolute;inset:0;display:grid;place-items:center;z-index:6}
.stage-heart img{width:min(74vw,820px);max-height:76vh;object-fit:contain;mix-blend-mode:screen;animation:float 5s ease-in-out infinite,pulseGlow 3.6s ease-in-out infinite}
.stage-ring{position:absolute;left:50%;top:50%;width:44vmin;height:44vmin;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,213,110,.12);box-shadow:0 0 70px rgba(216,157,42,.13),inset 0 0 60px rgba(216,157,42,.08);animation:ringStage 4s ease-in-out infinite}
@keyframes ringStage{50%{transform:translate(-50%,-50%) scale(1.1);opacity:.5}}

/* text */
#sceneText{position:absolute;z-index:70;left:7vw;right:7vw;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
.scene-line{font:italic 400 clamp(1.9rem,6.1vw,4.9rem)/1.2 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;color:#f4cf78;text-shadow:0 0 7px #000,0 0 15px #000,0 0 27px rgba(255,215,118,.68),0 0 60px rgba(164,94,4,.25);opacity:0;filter:blur(9px);transform:scale(.985)}
.scene-line.show{animation:textIn 1.15s ease forwards}.scene-line.leave{animation:textOut .85s ease forwards}
@keyframes textIn{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes textOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(10px);transform:scale(1.02)}}

/* dark ending */
#darkWash{position:absolute;inset:0;z-index:65;background:#000;opacity:0;transition:opacity .7s;pointer-events:none}
#darkWash.show{opacity:.96}
#darkHeart{position:absolute;inset:0;z-index:66;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
#darkHeart.show{opacity:.28}
#darkHeart img{width:min(74vw,800px);max-height:78vh;object-fit:contain;mix-blend-mode:screen;animation:float 5s ease-in-out infinite,pulseGlow 4.3s ease-in-out infinite}

/* seal */
#sealScene{position:absolute;inset:0;z-index:78;background:#000;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity 1s}
#sealScene.show{opacity:1}
#sealWrap{position:relative;width:min(50vw,430px);aspect-ratio:1;display:grid;place-items:center}
#sealAura{position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(circle,rgba(255,210,102,.32),rgba(188,119,18,.18) 26%,rgba(77,39,0,.07) 48%,transparent 72%);filter:blur(26px);animation:aura 4.2s ease-in-out infinite}
#seal{width:76%;opacity:0;filter:drop-shadow(0 0 20px rgba(255,216,111,.62)) drop-shadow(0 0 58px rgba(174,103,13,.34));transition:opacity 6s ease}
#seal.full{opacity:1}#seal.fade{opacity:0;transition-duration:10s}
#complete{position:absolute;inset:0;z-index:82;background:#000;display:grid;place-items:center;opacity:0;pointer-events:none}
#complete.show{animation:fadeIn .9s forwards}
#complete div{font:500 clamp(2.2rem,8vw,5.8rem)/1.05 Georgia,serif;letter-spacing:.08em;color:var(--g2);text-shadow:0 0 18px rgba(255,219,133,.55),0 0 60px rgba(162,92,5,.25)}
#complete div:before,#complete div:after{content:"";display:block;width:min(50vw,300px);height:1px;margin:16px auto;background:linear-gradient(90deg,transparent,#e5b75b,transparent);box-shadow:0 0 9px #c98b24}

@media(max-width:650px){.door-zone{width:54vw;height:46vh}.lantern{top:31%}.stage-heart img,.heart-img{width:94vw}.scene-line{font-size:clamp(1.6rem,8vw,3.5rem)}}
</style>
</head>
<body>
<main id="app">
<canvas id="fx"></canvas><div class="grain"></div><div class="vignette"></div>

<section id="boot" class="screen active"><div>
  <div class="load-title gold">LEVEL 4<br>WORDT GELADEN</div>
  <div class="load-shell"><div id="loadBar"></div></div><div id="loadPct">0%</div>
</div></section>

<section id="auth" class="screen"><div>
  <div class="authword gold">AUTHORIZED</div>
  <div class="waveform" id="wave"></div>
  <div class="verify">VERIFICATIE...</div>
</div></section>

<section id="access" class="screen"><div>
  <div class="access-ring"><div id="check" class="check"></div></div>
  <div id="accessText" class="access-text">TOEGANG VERLEEND</div>
</div></section>

<section id="countdown" class="screen"><div id="count">3</div></section>

<section id="clue" class="screen">
  <div class="heart-stage"><img class="heart-img" src="assets/winged-heart-gold.png" alt=""></div>
  <div style="position:relative;z-index:3">
    <div id="clueText" class="clue-copy">Sommige aanwijzingen<br>moet je niet zoeken.<br>Sommige moet je horen.</div>
    <button id="startLevel">START LEVEL 4</button>
  </div>
</section>

<section id="cinema">
  <div id="corridor">
    <div class="wall left"></div><div class="wall right"></div><div class="floor"></div>
    <div class="lantern l1"></div><div class="lantern l2"></div><div class="lantern l3"></div><div class="lantern l4"></div>
    <div class="door-zone">
      <div class="beyond" id="beyond"></div><div class="arch"></div><div class="door-light" id="doorLight"></div>
      <div class="door-panel left" id="doorL"></div><div class="door-panel right" id="doorR"></div>
    </div>
  </div>

  <div id="stage">
    <div class="stage-haze"></div>
    <i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i>
    <div class="stage-ring"></div>
    <div class="stage-heart"><img src="assets/winged-heart-gold.png" alt=""></div>
    <div class="crowd"></div>
  </div>

  <div id="darkWash"></div>
  <div id="darkHeart"><img src="assets/winged-heart-gold.png" alt=""></div>
  <div id="sceneText"></div>
</section>

<section id="sealScene"><div id="sealWrap"><div id="sealAura"></div><img id="seal" src="assets/dh-seal.png" alt="DH zegel"></div></section>
<section id="complete"><div>LEVEL 4<br>VOLTOOID</div></section>
<audio id="song" preload="auto" src="assets/song.mp3"></audio>
</main>

<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const screens=[...document.querySelectorAll('.screen')];
function showScreen(id){screens.forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
for(let i=0;i<52;i++){let b=document.createElement('i');$('#wave').appendChild(b)}

const cv=$('#fx'),ctx=cv.getContext('2d');let particles=[];
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function burst(power=1,x=innerWidth/2,y=innerHeight/2){
  const n=Math.floor(52*power);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(2+Math.random()*5.2)*power;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,size:.7+Math.random()*2.2*power})}
}
function fxloop(){ctx.clearRect(0,0,innerWidth,innerHeight);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.045;p.life-=.012;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=Math.random()>.2?'#ffd77b':'#b87515';ctx.shadowBlur=13;ctx.shadowColor='#d89226';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()});particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(fxloop)}fxloop();

let ac=null;function A(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac}
function tone(freq=220,dur=.18,type='sine',gain=.08,delay=0){const a=A(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,a.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+.03)}
function boom(power=1){const a=A(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(100,a.currentTime);o.frequency.exponentialRampToValueAtTime(31,a.currentTime+.43);g.gain.setValueAtTime(.34*power,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.48);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.5);const len=a.sampleRate*.34,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const n=a.createBufferSource(),ng=a.createGain(),f=a.createBiquadFilter();n.buffer=b;f.type='highpass';f.frequency.value=105;ng.gain.setValueAtTime(.28*power,a.currentTime);ng.gain.exponentialRampToValueAtTime(.001,a.currentTime+.34);n.connect(f).connect(ng).connect(a.destination);n.start()}
function authSound(){tone(130,.15,'sine',.05);tone(210,.2,'sine',.065,.13);tone(330,.25,'sine',.075,.28)}
function accessSound(){tone(220,.25,'sine',.06);tone(440,.38,'sine',.09,.12);tone(660,.5,'sine',.08,.26)}
function clueSound(){tone(520,.35,'sine',.035);tone(780,.6,'sine',.04,.22);tone(1040,.8,'sine',.025,.48)}

async function impact(n,s){
 const sc=$('#countdown'),c=$('#count');c.textContent=n;c.classList.remove('hit');sc.className='screen active';void c.offsetWidth;c.classList.add('hit');sc.classList.add('impact'+s);burst(.8+s*.65);boom(.62+s*.26);
 if(navigator.vibrate)navigator.vibrate(s===3?[140,40,190,50,230]:s===2?[100,30,140]:[70,20,90]);await wait(1120)
}
async function intro(){
 for(let p=0;p<=100;p+=4){$('#loadBar').style.width=p+'%';$('#loadPct').textContent=p+'%';if(p%20===0)tone(90+p*1.65,.04,'square',.012);await wait(55)}
 await wait(400);showScreen('#auth');authSound();await wait(2600);
 showScreen('#access');accessSound();await wait(330);$('#check').classList.add('draw');await wait(470);$('#accessText').classList.add('show');await wait(1750);
 showScreen('#countdown');await impact('3',1);await wait(620);await impact('2',2);await wait(600);await impact('1',3);await wait(480);
 burst(3.3);boom(1.5);if(navigator.vibrate)navigator.vibrate([170,50,220,60,280]);await wait(660);
 showScreen('#clue');clueSound();$('#clueText').classList.add('show');for(let i=0;i<5;i++)setTimeout(()=>burst(.5,innerWidth*(.14+.18*i),innerHeight*(.25+Math.random()*.45)),i*280);
 await wait(3900);$('#clueText').style.transition='opacity 1s';$('#clueText').style.opacity=0;await wait(1100);$('#startLevel').classList.add('show')
}

const song=$('#song'),sceneText=$('#sceneText');
function text(html){

}

let idx=0,raf=0;
function loop(){const t=song.currentTime;while(idx<ev.length&&t>=ev[idx].t){if(ev[idx].a)ev[idx].a();text(ev[idx].x||'');idx++}raf=requestAnimationFrame(loop)}
