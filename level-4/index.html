<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020202"><title>De Onthulling — Level 4</title>
<style>
:root{--gold:#d6a94c;--gold2:#ffe9a8;--gold3:#fff8d8;--white:#faf5ea;--muted:#8f887b;--black:#020202}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020202;color:var(--white);overflow:hidden;font-family:Arial,Helvetica,sans-serif}button{font:inherit}#app{position:relative;width:100%;height:100dvh;background:radial-gradient(circle at 50% 42%,#17120b 0,#070604 28%,#020202 65%);isolation:isolate}.screen{position:absolute;inset:0;z-index:4;display:grid;place-items:center;align-content:center;text-align:center;padding:28px;opacity:0;transform:scale(.98);pointer-events:none;transition:opacity .8s ease,transform 1s ease}.screen.active{opacity:1;transform:scale(1);pointer-events:auto}.serif,h1,h2{font-family:Georgia,"Times New Roman",serif}.gold{color:var(--gold2);text-shadow:0 0 20px rgba(255,226,161,.45),0 0 48px rgba(216,181,108,.24)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.grain{position:absolute;inset:-30%;z-index:2;opacity:.035;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:4px 4px;animation:grain 8s steps(10) infinite}.vignette{position:absolute;inset:0;z-index:3;box-shadow:inset 0 0 22vw #000;pointer-events:none}.line{height:1px;width:0;margin:0 auto 30px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);box-shadow:0 0 25px rgba(255,226,161,.7)}.line.draw{animation:draw 2.1s ease forwards}.authorized{font-size:.68rem;letter-spacing:.5em;color:var(--gold2);opacity:0;margin-bottom:25px}.authorized.show{animation:auth 2.1s ease forwards}.logo{opacity:0;filter:blur(12px);transform:scale(.82);font-size:clamp(3rem,12vw,7.4rem);letter-spacing:.075em;line-height:.92}.logo.show{animation:logo 2.25s cubic-bezier(.16,.8,.24,1) forwards}.sub{margin-top:22px;color:var(--muted);font-size:.75rem;letter-spacing:.24em}.start{margin-top:48px;padding:16px 31px;border:1px solid rgba(216,181,108,.72);border-radius:999px;background:rgba(216,181,108,.08);color:var(--white);letter-spacing:.18em;font-size:.71rem;cursor:pointer;box-shadow:0 0 42px rgba(216,181,108,.09);opacity:0;pointer-events:none;transition:.8s}.start.ready{opacity:1;pointer-events:auto}.start:hover{background:rgba(216,181,108,.15);box-shadow:0 0 58px rgba(216,181,108,.22)}.hint{opacity:0;color:var(--muted);font-size:.76rem;margin-top:16px;transition:1s}.hint.show{opacity:1}.protocol{width:min(86vw,570px)}.kicker{font-size:.67rem;letter-spacing:.38em;color:var(--gold);margin:0 0 20px}.log{height:235px;display:grid;align-content:center;gap:17px;text-align:left;font-size:.8rem;letter-spacing:.065em;color:#d4cec4}.entry{opacity:0;transform:translateY(8px)}.entry.show{animation:entry .65s ease forwards}.bar-shell{height:2px;background:rgba(255,255,255,.08);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 17px rgba(216,181,108,.75);transition:width .95s}.count{font-family:Georgia,serif;font-size:clamp(10rem,42vw,21rem);line-height:.72;color:var(--gold3);text-shadow:0 0 28px rgba(255,248,218,.95),0 0 85px rgba(255,205,84,.62),0 0 150px rgba(170,96,8,.45);opacity:1;filter:none;transform:scale(1)}.count.hit{animation:countHit 1.05s cubic-bezier(.1,.85,.25,1) both}#countdown.impact1{animation:shake1 .5s ease}#countdown.impact2{animation:shake2 .62s ease}#countdown.impact3{animation:shake3 .78s ease}.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,239,183,.66),rgba(216,181,108,.22) 23%,transparent 48%);opacity:0}.flash.go{animation:flash .72s ease}.ring{position:absolute;width:min(74vw,470px);aspect-ratio:1;border:1px solid rgba(255,226,161,.76);border-radius:50%;opacity:0;transform:scale(.2);box-shadow:0 0 30px rgba(255,226,161,.32)}.ring.go{animation:ring 1s ease-out}
#hintScreen{background:radial-gradient(circle at 50% 50%,#110c04 0,#050402 36%,#000 72%)}#hintText{font-family:"Edwardian Script ITC","Palace Script MT","Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:clamp(1.8rem,5.8vw,4.2rem);font-weight:400;line-height:1.5;color:#fff6cf;max-width:980px;text-shadow:0 0 5px rgba(255,255,240,.98),0 0 16px rgba(255,220,105,.92),0 0 44px rgba(225,154,25,.68);opacity:0;filter:blur(8px);animation:hintIn 2s .35s forwards}.dh-spark{position:absolute;font-family:Georgia,serif;font-weight:bold;letter-spacing:-.22em;color:rgba(255,226,161,.11);text-shadow:0 0 10px rgba(216,181,108,.26);transform:rotate(-10deg);right:12%;bottom:17%;font-size:clamp(1.4rem,5vw,3rem)}#levelStart{opacity:1;pointer-events:auto}
#movie{z-index:20;background:#000;padding:0;overflow:hidden}.stage{position:absolute;inset:0;overflow:hidden}.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none}.scene.show{opacity:1}

.corridor{background:radial-gradient(ellipse at 50% 46%,#21180d 0,#0b0805 34%,#020202 74%);perspective:1000px}.hall-ceiling{position:absolute;left:10%;right:10%;top:0;height:43%;clip-path:polygon(0 0,100% 0,68% 100%,32% 100%);background:linear-gradient(#050403,#151009 72%,#21180d);opacity:.9}.hall-floor{position:absolute;left:0;right:0;bottom:0;height:46%;clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);background:repeating-linear-gradient(92deg,#0b0804 0 38px,#171006 39px 41px),linear-gradient(#1a1208,#050403);box-shadow:inset 0 35px 70px #000}.hall-wall{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#020202,#141008 70%,#21180d);opacity:.96}.hall-wall.left{left:0;clip-path:polygon(0 0,100% 32%,100% 68%,0 100%)}.hall-wall.right{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 32%,100% 68%,0 100%)}.moulding{position:absolute;left:14%;right:14%;top:58%;height:2px;background:linear-gradient(90deg,transparent,#5c4524,transparent);opacity:.45}.sconce{position:absolute;top:39%;width:12px;height:18px;border-radius:50%;background:#e1b75f;box-shadow:0 0 14px #d49d38,0 0 35px rgba(214,159,56,.42);opacity:.22}.sconce.left{left:22%}.sconce.right{right:22%}

.doorleaf.left{background-position:left center;transform-origin:left center;border-radius:4px 0 0 4px;}
.doorleaf.right{background-position:right center;transform-origin:right center;border-radius:0 4px 4px 0;}
.photo-door.light .doorleaf{filter:brightness(.9) contrast(1.1) saturate(.82);box-shadow:0 0 28px rgba(255,199,64,.22),inset 0 0 20px rgba(0,0,0,.55);}
.photo-door.open .doorleaf.left{transform:rotateY(77deg);}
.photo-door.open .doorleaf.right{transform:rotateY(-77deg);}
.door-shadow{position:absolute;inset:-2% -5%;background:linear-gradient(90deg,rgba(0,0,0,.7),transparent 17%,transparent 83%,rgba(0,0,0,.7));pointer-events:none;}
.underlight{position:absolute;left:50%;bottom:11.5%;width:min(39vw,330px);height:8px;transform:translateX(-50%);background:#fff4bd;filter:blur(8px);box-shadow:0 0 38px #f2bb3d,0 0 80px rgba(240,164,29,.7);opacity:0;transition:opacity 2s,width 2s}
.underlight.show{opacity:1;width:min(47vw,390px)}
.whiteout{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fffdf0 0,#f7dc82 20%,rgba(210,146,35,.48) 43%,transparent 76%);opacity:0;transition:opacity 2.2s}
.whiteout.show{opacity:1}
/* blended hart: zwart verdwijnt, beeld wordt visueel onderdeel van de gloed */
#heartScene{display:grid;place-items:center;background:radial-gradient(circle,rgba(216,181,108,.13),#000 61%)}#heart{width:min(58vw,610px);max-height:62vh;object-fit:contain;opacity:.46;mix-blend-mode:screen;filter:saturate(.92) brightness(.9) drop-shadow(0 0 24px rgba(216,181,108,.18));-webkit-mask-image:radial-gradient(ellipse at center,#000 50%,rgba(0,0,0,.9) 67%,transparent 90%);mask-image:radial-gradient(ellipse at center,#000 50%,rgba(0,0,0,.9) 67%,transparent 90%);transform:scale(.92);transition:transform 1.6s ease,filter 1.6s ease,opacity 1.8s ease}#heartScene.big #heart{transform:scale(.98);opacity:.53;filter:saturate(1) brightness(.95) drop-shadow(0 0 42px rgba(255,226,161,.24))}#heartScene.fadeheart #heart{opacity:.08;transform:scale(.97)}
.warm{background:radial-gradient(ellipse at 50% 50%,rgba(181,123,32,.22) 0,rgba(79,49,11,.13) 27%,#000 67%)}.warm:before,.warm:after{content:"";position:absolute;width:44vw;height:44vw;border-radius:50%;filter:blur(45px);background:radial-gradient(circle,rgba(255,202,73,.16),transparent 65%);animation:floatGlow 7s ease-in-out infinite alternate}
.warm:before{left:-8vw;top:18%}.warm:after{right:-8vw;bottom:5%;animation-delay:-2.8s}
.echo{position:absolute;opacity:0;mix-blend-mode:screen;filter:brightness(.82) saturate(.85) blur(.2px) drop-shadow(0 0 16px rgba(221,166,62,.15));transition:opacity 1.6s ease,transform 5s ease;pointer-events:none}
.echo.show{opacity:.13}
.echo.wingL{left:-2vw;top:18%;width:min(34vw,430px);transform:translateX(-3vw) rotate(-4deg)}
.echo.wingR{right:-2vw;top:17%;width:min(34vw,430px);transform:translateX(3vw) rotate(4deg)}
.echo.core{left:50%;top:50%;width:min(29vw,340px);transform:translate(-50%,-48%) scale(.96);opacity:0}
.echo.core.show{opacity:.08;transform:translate(-50%,-50%) scale(1.03)}
.echo.smoke{left:50%;top:3%;width:min(42vw,520px);transform:translateX(-50%);opacity:0}
.echo.smoke.show{opacity:.11;transform:translateX(-50%) translateY(1.5vh)}
.party .echo.show{opacity:.16}
.ambient-star{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe8a8;box-shadow:0 0 12px #ffd36b,0 0 25px rgba(211,134,19,.8);opacity:.3;animation:starFloat 4s ease-in-out infinite alternate}
.ambient-star.s1{left:24%;top:35%} .ambient-star.s2{right:27%;top:58%;animation-delay:-1.7s} .ambient-star.s3{left:46%;top:22%;animation-delay:-.8s}
@keyframes starFloat{to{transform:translateY(-18px) scale(1.8);opacity:.8}}

lute;left:50%;top:50%;height:1px;width:min(68vw,600px);transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,var(--gold2),transparent);opacity:0;box-shadow:0 0 18px rgba(255,225,130,.5)}.breakline.show{opacity:1;animation:breakline 2.8s forwards}
#sealScene{display:grid;place-items:center;background:#000;overflow:hidden}#sealAura{position:absolute;width:min(78vw,620px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,239,164,.34) 0,rgba(230,169,50,.16) 28%,rgba(138,78,7,.05) 53%,transparent 71%);opacity:0;filter:blur(16px);transform:scale(.7);transition:opacity 7s ease,transform 9s ease}.seal-rays{position:absolute;width:min(76vw,610px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,231,140,0) 0 7deg,rgba(255,221,107,.12) 9deg,rgba(255,231,140,0) 13deg);filter:blur(7px);opacity:0;animation:spin 18s linear infinite;transition:opacity 8s ease}#seal{width:min(52vw,350px);max-height:50vh;object-fit:contain;opacity:0;filter:brightness(.92) saturate(1.05) drop-shadow(0 0 20px rgba(216,181,108,.45));transition:opacity 8s ease,filter 5s ease,transform 8s ease;transform:scale(.88)}#sealScene.reveal #sealAura{opacity:1;transform:scale(1.18)}#sealScene.reveal .seal-rays{opacity:.78}#seal.reveal{opacity:1;transform:scale(1);filter:brightness(1.65) saturate(1.28) contrast(1.1) drop-shadow(0 0 18px #fff9d4) drop-shadow(0 0 52px rgba(255,220,88,1)) drop-shadow(0 0 120px rgba(220,139,10,.95));animation:sealShine 2.9s ease-in-out infinite alternate}#seal.fade{opacity:0;transition-duration:10s}.complete{position:absolute;inset:0;display:grid;place-items:center;font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-style:italic;font-size:clamp(2rem,7vw,5rem);letter-spacing:.08em;color:#fff2b2;opacity:0;text-shadow:0 0 7px #fff8d8,0 0 25px rgba(255,211,91,.9),0 0 60px rgba(196,119,15,.7)}.complete.show{animation:completeIn 1s forwards}

<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let started=false,sfxCtx=null;
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function ensureSfx(){if(!sfxCtx){sfxCtx=new (window.AudioContext||window.webkitAudioContext)()}if(sfxCtx.state==='suspended')sfxCtx.resume();return sfxCtx}
function boomSound(level=1){const ctx=ensureSfx(),now=ctx.currentTime;const dur=.9+.12*level;const size=Math.floor(ctx.sampleRate*dur);const b=ctx.createBuffer(1,size,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<size;i++){const x=i/size;d[i]=(Math.random()*2-1)*(1-x)**1.75}const src=ctx.createBufferSource();src.buffer=b;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(1200+level*330,now);lp.frequency.exponentialRampToValueAtTime(95,now+dur);const g=ctx.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.22+.08*level,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);src.connect(lp).connect(g).connect(ctx.destination);src.start(now);const o=ctx.createOscillator(),og=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(78-level*6,now);o.frequency.exponentialRampToValueAtTime(24,now+.7);og.gain.setValueAtTime(.0001,now);og.gain.exponentialRampToValueAtTime(.28+.065*level,now+.012);og.gain.exponentialRampToValueAtTime(.0001,now+.82);o.connect(og).connect(ctx.destination);o.start(now);o.stop(now+.84);if(level>=3){const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type='triangle';o2.frequency.setValueAtTime(155,now);o2.frequency.exponentialRampToValueAtTime(47,now+.34);g2.gain.setValueAtTime(.12,now);g2.gain.exponentialRampToValueAtTime(.0001,now+.45);o2.connect(g2).connect(ctx.destination);o2.start(now);o2.stop(now+.46)}}
function hintSound(){const ctx=ensureSfx(),t=ctx.currentTime;whoosh();[329.63,493.88,659.25,987.77].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+.18+i*.11);g.gain.exponentialRampToValueAtTime(.12/(1+i*.18),t+.22+i*.11);g.gain.exponentialRampToValueAtTime(.0001,t+1.4+i*.14);o.connect(g).connect(ctx.destination);o.start(t+.18+i*.11);o.stop(t+1.5+i*.14)})}
function shimmer(delay=0,amp=.07){const ctx=ensureSfx(),t=ctx.currentTime+delay;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.075);g.gain.exponentialRampToValueAtTime(amp/(1+i*.22),t+i*.075+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.075+.75);o.connect(g).connect(ctx.destination);o.start(t+i*.075);o.stop(t+i*.075+.8)})}
function whoosh(){const ctx=ensureSfx(),now=ctx.currentTime,dur=1.5,size=Math.floor(ctx.sampleRate*dur);const b=ctx.createBuffer(1,size,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<size;i++){const x=i/size;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*x)*(0.4+0.6*x)}const src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=b;bp.type='bandpass';bp.frequency.setValueAtTime(240,now);bp.frequency.exponentialRampToValueAtTime(1900,now+1.05);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.065,now+.4);g.gain.exponentialRampToValueAtTime(.0001,now+dur);src.connect(bp).connect(g).connect(ctx.destination);src.start(now)}
function burst(power=1,canvas=$('fx')){const c=canvas,ctx=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let ps=[];for(let i=0;i<78*power;i++){let a=Math.random()*Math.PI*2,s=(1+Math.random()*5)*power;ps.push({x:innerWidth/2,y:innerHeight/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,r:1+Math.random()*2})}let t=performance.now();function f(n){t=n;ctx.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=.015;ctx.fillStyle=`rgba(255,220,135,${Math.max(0,p.life)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ps=ps.filter(p=>p.life>0);if(ps.length)requestAnimationFrame(f)}requestAnimationFrame(f)}

function showScene(id){['corridor','heartScene','warm','party','dark','sealScene'].forEach(x=>$(x).classList.remove('show'));$(id).classList.add('show')}
