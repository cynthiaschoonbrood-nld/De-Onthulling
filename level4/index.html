<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>De Onthulling — Level 4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&display=swap');

:root{
  --gold:#d8ad55;
  --gold2:#ffe2a0;
  --gold3:#9a6414;
  --black:#000;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
button{font:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}
.screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .75s ease;background:#000}
.screen.active{opacity:1;pointer-events:auto}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:200;pointer-events:none}
.vignette{position:absolute;inset:0;z-index:190;box-shadow:inset 0 0 22vw #000;pointer-events:none}
.grain{position:absolute;inset:-20%;z-index:189;opacity:.025;background-image:radial-gradient(#fff .5px,transparent .5px);background-size:4px 4px;animation:grain 9s steps(9) infinite;pointer-events:none}
@keyframes grain{to{transform:translate(2.3%,1.8%)}}
.gold{color:var(--gold2);text-shadow:0 0 8px rgba(255,227,160,.92),0 0 27px rgba(216,173,85,.5),0 0 70px rgba(120,70,0,.28)}
.ornate{font-family:"Great Vibes","Cormorant Garamond",Georgia,serif;font-weight:400}
.serif{font-family:"Cormorant Garamond",Georgia,serif}

/* ---------- reusable vector heart ---------- */
.heart-wrap{position:relative;display:grid;place-items:center;width:min(83vw,930px);height:min(73vh,720px)}
.winged-heart{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 16px rgba(255,198,73,.28))}
.heart-breathe{animation:heartFloat 5.2s ease-in-out infinite,heartGlow 3.8s ease-in-out infinite}
@keyframes heartFloat{0%,100%{transform:translateY(6px) scale(.985)}50%{transform:translateY(-10px) scale(1.018)}}
@keyframes heartGlow{0%,100%{filter:drop-shadow(0 0 15px rgba(232,172,55,.25))}50%{filter:drop-shadow(0 0 30px rgba(255,216,111,.72)) drop-shadow(0 0 80px rgba(162,92,4,.34))}}
.gold-haze{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,210,104,.20),rgba(147,85,2,.07) 44%,transparent 72%);filter:blur(22px);animation:hazePulse 4.6s ease-in-out infinite}
@keyframes hazePulse{50%{transform:scale(1.16);opacity:.62}}

/* ---------- OPEN / LOAD ---------- */
#boot{z-index:170;background:radial-gradient(circle at 50% 43%,#1c1204,#070402 35%,#000 72%)}
.boot-title{font-size:clamp(2.4rem,8vw,5.4rem);font-weight:400;letter-spacing:.12em;line-height:1.05;margin:0}
.progress-shell{width:min(74vw,540px);height:4px;margin:30px auto 0;border:1px solid rgba(223,177,83,.55);background:#171005;overflow:hidden}
#progress{height:100%;width:0;background:linear-gradient(90deg,#71450a,var(--gold2));box-shadow:0 0 20px #d3962b;transition:width .22s ease}
#progressText{margin-top:11px;font:11px Arial,sans-serif;letter-spacing:.27em;color:#ba8c3f}
#openLevel{margin-top:32px;padding:13px 27px;border:1px solid rgba(255,222,139,.68);background:rgba(71,39,3,.24);color:var(--gold2);letter-spacing:.17em;border-radius:3px;cursor:pointer;box-shadow:0 0 25px rgba(207,149,45,.15);transition:.4s}
#openLevel:hover{background:rgba(114,67,8,.35);box-shadow:0 0 38px rgba(220,163,55,.3)}
.openhint{font:11px Arial,sans-serif;color:#71664f;margin-top:13px}

/* ---------- AUTHORIZED ---------- */
#authorized{z-index:168}
.auth-word{font-size:clamp(2.8rem,10vw,6.8rem);font-weight:400;letter-spacing:.12em}
.voicewave{width:min(76vw,570px);height:78px;margin:20px auto 6px;display:flex;align-items:center;justify-content:center;gap:3px}
.voicewave i{display:block;width:2px;height:6px;background:linear-gradient(var(--gold2),#74470a);box-shadow:0 0 9px #cf922b;animation:voice .64s ease-in-out infinite}
.voicewave i:nth-child(2n){animation-delay:-.17s}.voicewave i:nth-child(3n){animation-delay:-.34s}.voicewave i:nth-child(5n){animation-delay:-.51s}
@keyframes voice{0%,100%{height:6px;opacity:.32}50%{height:58px;opacity:1}}
.verify{font:11px Arial,sans-serif;letter-spacing:.32em;color:#a67e35}

/* ---------- ACCESS ---------- */
#access{z-index:167}
.access-ring{width:158px;height:158px;border:1px solid rgba(255,221,139,.72);border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 33px rgba(222,170,66,.25),inset 0 0 25px rgba(216,173,85,.08)}
.access-ring:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(218,167,67,.22);animation:ringBreath 1.9s ease-in-out infinite}
@keyframes ringBreath{50%{transform:scale(1.08);opacity:.35}}
.checkmark{width:60px;height:31px;border-left:5px solid var(--gold2);border-bottom:5px solid var(--gold2);transform:rotate(-45deg) scale(.06);opacity:0;filter:drop-shadow(0 0 10px #dca63c)}
.checkmark.draw{animation:drawCheck .9s cubic-bezier(.2,.86,.2,1) forwards}
@keyframes drawCheck{to{transform:rotate(-45deg) scale(1);opacity:1}}
.access-copy{margin-top:29px;font-size:clamp(1.3rem,4vw,2.35rem);letter-spacing:.13em;opacity:0}
.access-copy.show{animation:fade .7s forwards}
@keyframes fade{to{opacity:1}}

/* ---------- COUNTDOWN ---------- */
#countdown{z-index:166;background:radial-gradient(circle at 50% 50%,rgba(132,78,4,.18),#000 52%)}
#number{font-size:clamp(11rem,46vw,25rem);line-height:.68;color:var(--gold2);font-weight:400;text-shadow:0 0 30px rgba(255,230,170,.96),0 0 95px rgba(216,153,29,.68);opacity:0}
#number.hit{animation:numberHit 1.08s cubic-bezier(.1,.82,.22,1)}
@keyframes numberHit{0%{opacity:0;filter:blur(18px);transform:scale(.42)}28%{opacity:1;filter:blur(0);transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
#countdown.shake1{animation:shake1 .55s}#countdown.shake2{animation:shake2 .68s}#countdown.shake3{animation:shake3 .84s}
@keyframes shake1{20%{transform:translate(3px,-2px)}40%{transform:translate(-3px,2px)}}
@keyframes shake2{14%{transform:translate(8px,-5px) scale(1.02)}30%{transform:translate(-8px,5px)}50%{transform:translate(5px,-3px)}}
@keyframes shake3{9%{transform:translate(14px,-10px) scale(1.05)}22%{transform:translate(-13px,9px)}36%{transform:translate(10px,-6px)}52%{transform:translate(-7px,4px)}}

/* ---------- CLUE / START ---------- */
#clue{z-index:165;background:radial-gradient(circle at 50% 50%,rgba(122,70,4,.12),#000 61%)}
.clue-heart{position:absolute;inset:0;display:grid;place-items:center}
.clue-text{position:relative;z-index:5;font-size:clamp(2rem,6.2vw,5rem);line-height:1.15;color:#f3cb6d;text-shadow:0 0 7px #000,0 0 18px #000,0 0 30px rgba(255,213,109,.62);opacity:0}
.clue-text.show{animation:textReveal 1.35s ease forwards}
@keyframes textReveal{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
#startLevel{position:relative;z-index:6;margin-top:24px;padding:14px 30px;border:1px solid rgba(255,220,132,.78);border-radius:3px;background:rgba(62,35,4,.36);color:var(--gold2);letter-spacing:.12em;cursor:pointer;opacity:0;pointer-events:none;box-shadow:0 0 26px rgba(215,159,53,.18)}
#startLevel.show{opacity:1;pointer-events:auto;transition:opacity .8s}
.flourish{position:relative;z-index:6;margin:12px auto 0;width:125px;height:22px;opacity:0;transition:opacity .8s}
.flourish.show{opacity:1}
.flourish:before,.flourish:after{content:"";position:absolute;top:10px;width:52px;height:1px;background:linear-gradient(90deg,transparent,#e0b252)}
.flourish:before{left:0}.flourish:after{right:0;transform:scaleX(-1)}
.flourish span{position:absolute;left:50%;top:4px;width:14px;height:14px;border:1px solid #e0b252;transform:translateX(-50%) rotate(45deg);box-shadow:0 0 9px rgba(225,175,78,.35)}

/* ---------- CINEMA ---------- */
#cinema{z-index:80}
#corridor,#heartWorld,#stage,#darkWorld,#sealWorld,#completeWorld{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 1s ease;overflow:hidden}
#corridor.show,#heartWorld.show,#stage.show,#darkWorld.show,#sealWorld.show,#completeWorld.show{opacity:1}
#corridor{background:radial-gradient(ellipse at 50% 52%,rgba(59,39,14,.28),rgba(9,8,7,.91) 40%,#010101 75%)}
.wall{position:absolute;top:0;bottom:0;width:48%;background:
repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.025) 32px 33px),
repeating-linear-gradient(90deg,#0a0907 0 76px,#14110c 77px 79px,#070605 80px 82px);filter:brightness(.72)}
.wall.left{left:-17%;transform:skewY(5deg)} .wall.right{right:-17%;transform:skewY(-5deg)}
.floor{position:absolute;left:-6%;right:-6%;bottom:-2%;height:43%;background:
linear-gradient(to top,rgba(0,0,0,.02),rgba(0,0,0,.77)),
repeating-linear-gradient(90deg,transparent 0 115px,rgba(193,145,60,.08) 116px 118px),
repeating-linear-gradient(0deg,#0c0b09 0 52px,#15120d 53px 55px);
transform:perspective(470px) rotateX(59deg);transform-origin:bottom center}
.lantern{position:absolute;top:28%;width:17px;height:44px;background:linear-gradient(#47310e,#ffd26a 40%,#724a0b);border:2px solid #2b2115;border-radius:45% 45% 35% 35%;box-shadow:0 0 12px #e5a83d,0 0 36px rgba(225,160,44,.5)}
.lantern:before{content:"";position:absolute;width:2px;height:28px;background:#332515;left:50%;bottom:100%}
.l1{left:13%}.l2{left:27%;transform:scale(.73)}.l3{right:13%}.l4{right:27%;transform:scale(.73)}
.door-zone{position:absolute;left:50%;top:48%;width:min(36vw,350px);height:min(58vh,530px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 16px rgba(0,0,0,.9))}
.arch{position:absolute;inset:-6% -9% -2%;border:9px solid #2c271f;border-bottom-width:14px;border-radius:47% 47% 4% 4%/18% 18% 3% 3%;box-shadow:inset 0 0 20px #000,0 0 0 3px #0c0b09}
.door-panel{position:absolute;top:0;bottom:0;width:50%;background:
linear-gradient(90deg,rgba(255,255,255,.035),transparent 18% 82%,rgba(0,0,0,.34)),
repeating-linear-gradient(0deg,#2a1e14 0 23%,#15100c 23.5% 24%,#513820 24.5% 25%);
border:7px solid #1c1915;box-shadow:inset 0 0 0 4px #52402c,inset 0 0 33px #070503;transform-style:preserve-3d;transition:transform 2.7s cubic-bezier(.2,.72,.13,1)}
.door-panel:before{content:"";position:absolute;inset:5% 8%;background:
repeating-linear-gradient(0deg,transparent 0 23%,rgba(51,45,35,.95) 23.4% 25%),
repeating-linear-gradient(90deg,transparent 0 46%,rgba(57,48,35,.95) 47% 53%,transparent 54%),
radial-gradient(circle at 12% 9%,#897453 0 2px,#14110e 3px 5px,transparent 6px);
background-size:auto,auto,42px 42px;box-shadow:inset 0 0 0 3px #080706}
.door-panel.left{left:0;transform-origin:left center}.door-panel.right{right:0;transform-origin:right center}
.door-panel.left.open{transform:rotateY(-98deg)}.door-panel.right.open{transform:rotateY(98deg)}
.door-light{position:absolute;left:50%;bottom:-3%;width:76%;height:12%;transform:translateX(-50%);background:radial-gradient(ellipse,#fff0ab,rgba(255,185,55,.82) 32%,transparent 72%);filter:blur(9px);opacity:0;transition:opacity 4s ease,transform 5s ease}
.door-light.glow{opacity:1;transform:translateX(-50%) scale(1.25)}
.beyond{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff8cf,#ffd66a 13%,rgba(255,182,39,.78) 30%,rgba(105,52,0,.13) 55%,transparent 73%);opacity:0;transition:opacity 2s}
.beyond.show{opacity:1}
#corridor.walk{animation:walk 35s linear forwards}
@keyframes walk{from{transform:scale(1)}to{transform:scale(1.14)}}

/* common scene heart world */
#heartWorld,#stage{background:radial-gradient(circle at 50% 48%,rgba(116,66,3,.14),#000 57%)}
.scene-heart{position:absolute;inset:0;display:grid;place-items:center}
.ornaments{position:absolute;inset:0;opacity:.75;pointer-events:none}
.ornament-line{position:absolute;border:1px solid rgba(234,180,65,.45);border-radius:50%;filter:drop-shadow(0 0 8px rgba(216,151,35,.28))}
.o1{width:38vw;height:20vw;left:4%;top:21%;transform:rotate(-13deg)}.o2{width:38vw;height:20vw;right:4%;top:22%;transform:rotate(14deg)}.o3{width:45vw;height:26vw;left:27%;bottom:4%;transform:rotate(7deg)}
.spark-cloud{position:absolute;inset:0;background:
radial-gradient(circle at 18% 31%,rgba(255,203,87,.35) 0 1px,transparent 2px),
radial-gradient(circle at 76% 22%,rgba(255,203,87,.35) 0 1px,transparent 2px),
radial-gradient(circle at 59% 69%,rgba(255,203,87,.3) 0 1px,transparent 2px),
radial-gradient(circle at 33% 72%,rgba(255,203,87,.28) 0 1px,transparent 2px);
background-size:90px 90px,130px 130px,110px 110px,150px 150px;animation:sparksDrift 12s linear infinite}
@keyframes sparksDrift{to{background-position:90px -70px,-90px 70px,70px -90px,-80px 80px}}
#sceneText{position:absolute;left:6vw;right:6vw;top:50%;transform:translateY(-50%);z-index:20;text-align:center;pointer-events:none}
.line{font-size:clamp(2.2rem,6.4vw,5.5rem);line-height:1.03;color:#f1c661;text-shadow:0 0 7px #000,0 0 16px #000,0 0 30px rgba(255,211,106,.7);opacity:0;filter:blur(9px);transform:scale(.985)}
.line.show{animation:lineIn 1.15s ease forwards}.line.leave{animation:lineOut .85s ease forwards}
@keyframes lineIn{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes lineOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(10px);transform:scale(1.02)}}

/* stage */
#stage{background:radial-gradient(ellipse at 50% 43%,rgba(115,67,3,.2),transparent 45%),linear-gradient(#030303,#000)}
.beam{position:absolute;top:-15%;width:12%;height:125%;background:linear-gradient(to bottom,rgba(255,218,111,.52),rgba(216,148,32,.1) 48%,transparent 80%);filter:blur(5px);transform-origin:top center;animation:sweep 4.8s ease-in-out infinite alternate}
.b1{left:8%;transform:rotate(19deg)}.b2{left:29%;animation-delay:-1.2s;transform:rotate(7deg)}.b3{right:29%;animation-delay:-2.3s;transform:rotate(-7deg)}.b4{right:8%;animation-delay:-3.1s;transform:rotate(-19deg)}
@keyframes sweep{to{transform:rotate(-13deg) translateX(5vw)}}
.crowd{position:absolute;left:-3%;right:-3%;bottom:-1%;height:24%;background:
radial-gradient(circle at 3% 61%,#050505 0 12px,transparent 13px),
radial-gradient(circle at 10% 53%,#050505 0 11px,transparent 12px),
radial-gradient(circle at 17% 65%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 25% 55%,#050505 0 10px,transparent 11px),
radial-gradient(circle at 34% 64%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 43% 54%,#050505 0 11px,transparent 12px),
radial-gradient(circle at 52% 65%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 61% 54%,#050505 0 11px,transparent 12px),
radial-gradient(circle at 70% 64%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 79% 54%,#050505 0 11px,transparent 12px),
radial-gradient(circle at 88% 65%,#050505 0 13px,transparent 14px),
radial-gradient(circle at 97% 56%,#050505 0 11px,transparent 12px),
linear-gradient(transparent 0 36%,#030303 37% 100%);
filter:drop-shadow(0 -10px 20px #000)}

/* dark finale */
#darkWorld{background:#000}
#darkHeart{opacity:.18;transition:opacity 1s}
#lightning{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#lightning.on{opacity:1}
.bolt{position:absolute;top:12%;width:2px;height:72vh;background:linear-gradient(transparent,#ffe7a9 13%,#c98b20 50%,#ffe9b2 80%,transparent);box-shadow:0 0 10px #d29127,0 0 32px rgba(255,194,65,.6);transform-origin:top;opacity:0}
.bolt:nth-child(1){left:41%;transform:rotate(23deg)}.bolt:nth-child(2){left:59%;transform:rotate(-27deg);animation-delay:-.35s!important}.bolt:nth-child(3){left:29%;transform:rotate(35deg);animation-delay:-.65s!important}.bolt:nth-child(4){left:71%;transform:rotate(-39deg);animation-delay:-.15s!important}
#lightning.mild .bolt:nth-child(1){animation:flash 2.6s infinite}
#lightning.medium .bolt:nth-child(-n+2){animation:flash 1.75s infinite}
#lightning.strong .bolt{animation:flash 1.08s infinite}
@keyframes flash{0%,82%,100%{opacity:0}84%{opacity:.22}86%{opacity:1}89%{opacity:.06}91%{opacity:.72}94%{opacity:0}}

/* seal */
#sealWorld{background:#000;display:grid;place-items:center}
.seal-wrap{position:relative;width:min(52vw,440px);aspect-ratio:1;display:grid;place-items:center}
#liquidGold{position:absolute;inset:-60%;border-radius:50%;background:
radial-gradient(ellipse at 50% 50%,rgba(255,210,99,.35),transparent 28%),
conic-gradient(from 0deg,transparent,rgba(205,132,24,.34),transparent,rgba(255,198,69,.28),transparent);
filter:blur(21px);animation:liquid 5.2s ease-in-out infinite alternate}
@keyframes liquid{to{transform:scale(1.14) rotate(11deg);filter:blur(28px);opacity:.72}}
#seal{width:78%;opacity:0;filter:drop-shadow(0 0 18px rgba(255,218,117,.68)) drop-shadow(0 0 58px rgba(178,105,12,.36));transition:opacity 6s ease}
#seal.full{opacity:1}#seal.fade{opacity:0;transition-duration:9s}

/* complete */
#completeWorld{background:#000;display:grid;place-items:center}
.complete{font-size:clamp(2.8rem,8vw,6.6rem);line-height:.9;color:var(--gold2);text-shadow:0 0 12px rgba(255,225,146,.75),0 0 52px rgba(192,126,22,.32);opacity:0;filter:blur(12px);transform:scale(.96)}
.complete.show{animation:complete 2.7s ease forwards}
@keyframes complete{to{opacity:1;filter:blur(0);transform:scale(1)}}
.complete-flourish{width:min(58vw,440px);height:36px;margin:16px auto;position:relative}
.complete-flourish:before,.complete-flourish:after{content:"";position:absolute;top:17px;width:45%;height:1px;background:linear-gradient(90deg,transparent,#e0b052)}
.complete-flourish:before{left:0}.complete-flourish:after{right:0;transform:scaleX(-1)}
.complete-flourish span{position:absolute;left:50%;top:10px;width:14px;height:14px;border:1px solid #e2b45c;transform:translateX(-50%) rotate(45deg);box-shadow:0 0 10px #a96a11}

@media(max-width:650px){
 .door-zone{width:55vw;height:47vh}
 .lantern{top:31%}
 .heart-wrap{width:97vw;height:70vh}
 .line{font-size:clamp(1.8rem,8vw,3.9rem)}
}
</style>
</head>
<body>
<div id="app">
<canvas id="fx"></canvas><div class="grain"></div><div class="vignette"></div>

<section id="boot" class="screen active">
 <div>
  <h1 class="boot-title gold serif">LEVEL 4<br>WORDT GELADEN</h1>
  <div class="progress-shell"><div id="progress"></div></div>
  <div id="progressText">KLAAR</div>
  <button id="openLevel">OPEN LEVEL</button>
  <div class="openhint">Zet je geluid aan voor de volledige ervaring.</div>
 </div>
</section>

<section id="authorized" class="screen">
 <div>
  <div class="auth-word gold serif">AUTHORIZED</div>
  <div id="voicewave" class="voicewave"></div>
  <div class="verify">VERIFICATIE...</div>
 </div>
</section>

<section id="access" class="screen">
 <div>
  <div class="access-ring"><div id="checkmark" class="checkmark"></div></div>
  <div id="accessCopy" class="access-copy gold">TOEGANG VERLEEND</div>
 </div>
</section>

<section id="countdown" class="screen"><div id="number" class="serif">3</div></section>

<section id="clue" class="screen">
 <div class="clue-heart">
   <div class="heart-wrap heart-breathe">
    <div class="gold-haze"></div>
    <svg class="winged-heart" viewBox="0 0 1000 640" aria-hidden="true">
      <defs>
       <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0ae"/><stop offset=".42" stop-color="#dba84b"/><stop offset="1" stop-color="#86500b"/></linearGradient>
       <radialGradient id="heartFill"><stop offset="0" stop-color="#4d2107"/><stop offset=".55" stop-color="#211108"/><stop offset="1" stop-color="#050302"/></radialGradient>
       <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g fill="none" stroke="url(#goldStroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" opacity=".92">
       <path d="M479 497 C410 450 332 375 332 286 C332 215 377 180 426 181 C462 182 488 205 500 229 C512 205 538 182 574 181 C623 180 668 215 668 286 C668 375 590 450 521 497 C514 502 507 507 500 513 C493 507 486 502 479 497Z" fill="url(#heartFill)"/>
       <path d="M344 265 C277 209 216 206 149 245 C214 245 263 268 307 306 C248 285 195 298 137 348 C210 322 272 329 331 370 C273 356 224 374 177 420 C239 392 295 399 365 438"/>
       <path d="M656 265 C723 209 784 206 851 245 C786 245 737 268 693 306 C752 285 805 298 863 348 C790 322 728 329 669 370 C727 356 776 374 823 420 C761 392 705 399 635 438"/>
       <path d="M343 280 C298 246 259 238 217 251 M327 317 C277 292 239 292 196 308 M339 357 C288 340 248 346 207 369 M365 400 C317 391 281 400 244 422"/>
       <path d="M657 280 C702 246 741 238 783 251 M673 317 C723 292 761 292 804 308 M661 357 C712 340 752 346 793 369 M635 400 C683 391 719 400 756 422"/>
       <path d="M411 238 C445 262 464 294 474 332 M589 238 C555 262 536 294 526 332"/>
       <path d="M385 314 C429 282 472 284 500 318 C528 284 571 282 615 314"/>
       <path d="M367 350 C418 318 469 327 500 364 C531 327 582 318 633 350"/>
       <path d="M353 386 C410 360 467 371 500 410 C533 371 590 360 647 386"/>
       <path d="M334 281 C314 249 319 221 348 203 M666 281 C686 249 681 221 652 203"/>
       <path d="M397 178 C376 137 389 102 429 88 M603 178 C624 137 611 102 571 88"/>
      </g>
      <g fill="none" stroke="#d7a43f" stroke-width="3" opacity=".55">
       <path d="M355 465 C231 520 165 489 109 430 C172 469 249 459 304 431"/>
       <path d="M645 465 C769 520 835 489 891 430 C828 469 751 459 696 431"/>
       <path d="M387 510 C262 567 186 545 131 502"/><path d="M613 510 C738 567 814 545 869 502"/>
      </g>
    </svg>
   </div>
 </div>
 <div style="position:relative;z-index:5">
  <div id="clueText" class="clue-text ornate">Sommige aanwijzingen moet je niet zoeken.<br>Sommige moet je horen.</div>
  <button id="startLevel">START LEVEL 4</button>
  <div id="flourish" class="flourish"><span></span></div>
 </div>
</section>

<section id="cinema" class="screen">
 <div id="corridor">
  <div class="wall left"></div><div class="wall right"></div><div class="floor"></div>
  <div class="lantern l1"></div><div class="lantern l2"></div><div class="lantern l3"></div><div class="lantern l4"></div>
  <div class="door-zone">
   <div id="beyond" class="beyond"></div><div class="arch"></div><div id="doorLight" class="door-light"></div>
   <div id="doorL" class="door-panel left"></div><div id="doorR" class="door-panel right"></div>
  </div>
 </div>

 <div id="heartWorld">
  <div class="spark-cloud"></div>
  <div class="ornaments"><i class="ornament-line o1"></i><i class="ornament-line o2"></i><i class="ornament-line o3"></i></div>
  <div class="scene-heart">
   <div class="heart-wrap heart-breathe"><div class="gold-haze"></div>
    <svg class="winged-heart" viewBox="0 0 1000 640" aria-hidden="true">
     <use href="#heartMaster"/>
    </svg>
   </div>
  </div>
 </div>

 <div id="stage">
  <div class="spark-cloud"></div>
  <i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i>
  <div class="ornaments"><i class="ornament-line o1"></i><i class="ornament-line o2"></i><i class="ornament-line o3"></i></div>
  <div class="scene-heart">
   <div class="heart-wrap heart-breathe"><div class="gold-haze"></div>
    <svg class="winged-heart" viewBox="0 0 1000 640" aria-hidden="true">
     <g fill="none" stroke="url(#g2)" stroke-width="7"></g>
    </svg>
   </div>
  </div>
  <div class="crowd"></div>
 </div>

 <div id="darkWorld">
  <div id="darkHeart" class="scene-heart">
   <div class="heart-wrap heart-breathe" style="opacity:.35"><div class="gold-haze"></div></div>
  </div>
  <div id="lightning"><i class="bolt"></i><i class="bolt"></i><i class="bolt"></i><i class="bolt"></i></div>
 </div>

 <div id="sealWorld">
  <div class="seal-wrap"><div id="liquidGold"></div><img id="seal" src="assets/dh-seal.png" alt="DH zegel"></div>
 </div>

 <div id="completeWorld">
  <div>
   <div class="complete-flourish"><span></span></div>
   <div id="completeText" class="complete serif">LEVEL 4<br>VOLTOOID</div>
   <div class="complete-flourish"><span></span></div>
  </div>
 </div>

 <div id="sceneText"></div>
</section>

<audio id="song" preload="auto" src="assets/song.mp3"></audio>
</div>

<script>
// ----- common helpers -----
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)], wait=ms=>new Promise(r=>setTimeout(r,ms));
for(let i=0;i<50;i++)$('#voicewave').appendChild(document.createElement('i'));
function showScreen(id){$$('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}

// Clone the detailed heart SVG from the clue into the cinematic scenes.
// This guarantees the exact same visual heart throughout the whole level.
function cloneHeartInto(container){
 const source=$('#clue .winged-heart');
 const target=container.querySelector('.winged-heart');
 target.replaceWith(source.cloneNode(true));
}
cloneHeartInto($('#heartWorld'));
cloneHeartInto($('#stage'));
const darkWrap=$('#darkHeart .heart-wrap');
const darkSvg=$('#clue .winged-heart').cloneNode(true);darkWrap.appendChild(darkSvg);

// ----- gold fireworks -----
const cvs=$('#fx'),ctx=cvs.getContext('2d');let sparks=[];
function resize(){cvs.width=innerWidth*devicePixelRatio;cvs.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function burst(power=1,x=innerWidth/2,y=innerHeight/2){
 for(let i=0;i<Math.floor(64*power);i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*5.5)*power;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:.7+Math.random()*2.3*power})}
}
(function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.05;p.life-=.012;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=Math.random()>.2?'#ffdb7c':'#b97817';ctx.shadowBlur=14;ctx.shadowColor='#d99728';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});sparks=sparks.filter(p=>p.life>0);ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(draw)})();

// ----- WebAudio: heavy cinematic booms -----
let ac;
function audio(){return ac||(ac=new (window.AudioContext||window.webkitAudioContext)())}
function softChime(){
 const a=audio(),now=a.currentTime;
 [294,440,587].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,now+i*.11);g.gain.exponentialRampToValueAtTime(.06,now+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.11+.48);o.connect(g).connect(a.destination);o.start(now+i*.11);o.stop(now+i*.11+.52)})
}
function cinematicBoom(power=1){
 const a=audio(),now=a.currentTime;
 // deep body
 const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(78,now);o.frequency.exponentialRampToValueAtTime(24,now+.68);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.55*power,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+.72);o.connect(g).connect(a.destination);o.start(now);o.stop(now+.76);
 // explosive burst
 const len=a.sampleRate*.68,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++){let t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.15)}
 const n=a.createBufferSource(),lp=a.createBiquadFilter(),ng=a.createGain();n.buffer=b;lp.type='lowpass';lp.frequency.setValueAtTime(2600,now);lp.frequency.exponentialRampToValueAtTime(190,now+.66);ng.gain.setValueAtTime(.46*power,now);ng.gain.exponentialRampToValueAtTime(.001,now+.68);n.connect(lp).connect(ng).connect(a.destination);n.start(now);
 // room tail
 [0.09,.17,.27].forEach((delay,i)=>{const oo=a.createOscillator(),gg=a.createGain();oo.type='triangle';oo.frequency.value=108-i*17;gg.gain.setValueAtTime(.09*power/(i+1),now+delay);gg.gain.exponentialRampToValueAtTime(.001,now+delay+.42);oo.connect(gg).connect(a.destination);oo.start(now+delay);oo.stop(now+delay+.45)})
}

// ----- intro -----
async function countdownHit(n,strength){
 const scr=$('#countdown'),num=$('#number');
 scr.className='screen active';num.textContent=n;num.classList.remove('hit');void num.offsetWidth;num.classList.add('hit');
 scr.classList.add('shake'+strength);
 burst(.8+strength*.65);cinematicBoom(.62+strength*.3);
 if(navigator.vibrate)navigator.vibrate(strength===3?[150,40,200,50,260]:strength===2?[105,30,145]:[70,20,90]);
 await wait(1220);
}
$('#openLevel').addEventListener('click',async()=>{
 await audio().resume();
 $('#openLevel').style.display='none';$('.openhint').style.display='none';$('#progressText').textContent='0%';
 for(let p=0;p<=100;p+=4){$('#progress').style.width=p+'%';$('#progressText').textContent=p+'%';await wait(50)}
 await wait(400);
 showScreen('#authorized');softChime();await wait(2500);
 showScreen('#access');softChime();await wait(300);$('#checkmark').classList.add('draw');await wait(460);$('#accessCopy').classList.add('show');await wait(1750);
 showScreen('#countdown');await countdownHit('3',1);await wait(430);await countdownHit('2',2);await wait(400);await countdownHit('1',3);await wait(360);
 burst(3.35);cinematicBoom(1.55);if(navigator.vibrate)navigator.vibrate([180,50,230,60,290]);await wait(700);
 showScreen('#clue');softChime();$('#clueText').classList.add('show');
 for(let i=0;i<5;i++)setTimeout(()=>burst(.55,innerWidth*(.14+i*.18),innerHeight*(.25+Math.random()*.48)),i*280);
 await wait(4300);$('#clueText').style.transition='opacity 1s';$('#clueText').style.opacity=0;await wait(1000);
 $('#startLevel').classList.add('show');$('#flourish').classList.add('show');
});

// ----- cinematic timeline -----
const song=$('#song');let idx=0,raf=0;
function world(id){
 ['#corridor','#heartWorld','#stage','#darkWorld','#sealWorld','#completeWorld'].forEach(x=>$(x).classList.remove('show'));
 $(id).classList.add('show');
}
function text(html){
 const holder=$('#sceneText'),old=holder.firstElementChild;
 if(old){old.classList.add('leave');setTimeout(()=>old.remove(),820)}
 if(!html)return;
 setTimeout(()=>{const d=document.createElement('div');d.className='line ornate';d.innerHTML=html;holder.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'))},170)
}
function lightning(level){
 const l=$('#lightning');l.className='';if(level)l.classList.add('on',level)
}
const timeline=[
 [0,()=>{world('#corridor');$('#corridor').classList.add('walk');text('Zolang wachten…')}],
 [7,()=>text('Opgesloten…')],
 [14,()=>text('In een wereld zo klein…')],
 [23,()=>{$('#doorLight').classList.add('glow');text('Maar dat is nu afgelopen…')}],
 [35,()=>{$('#beyond').classList.add('show');$('#doorL').classList.add('open');$('#doorR').classList.add('open');burst(.7);text('Oh, alles valt nu op zijn plek')}],
 [39,()=>{world('#heartWorld');text('En ik wil nergens anders zijn<br>dan hier in ’t volle licht')}],
 [58,()=>{text('Zo zijn wij op ons best');burst(.45)}],
 [72,()=>text('Een vriendschap met verschillen<br>Maar we zouden niets anders willen')],
 [88,()=>text('Samen uit<br>samen thuis')],
 [107,()=>{world('#stage');text('Want wij willen dat je bij ons bent<br>als de show begint')}],
 [118,()=>{text('De muziek gaat veel te hard');burst(.35)}],
 [132,()=>text('Raken onszelf weer kwijt,<br>vergeten de tijd')],
 [147,()=>{text('WE GAAN DOOR');burst(.8)}],
 [150.5,()=>{text('WIJ GAAN DOOR');burst(1.0)}],
 [155,()=>text('Zo zijn wij op ons best')],
 [175,()=>text('Samen uit<br>samen thuis')],
 [204,()=>{world('#darkWorld');lightning('mild');text('Het lijkt soms zo verdomd eenvoudig')}],
 [210,()=>{lightning('mild');text('Maar dat is het niet.')}],
 [216,()=>{lightning('medium');text('Nee we doen niet wat niet goed voelt')}],
 [220,()=>{lightning('strong');text('NU BEN JE ONS KWIJT')}],
 [236,()=>{lightning('medium');text('Je begint hem nu te knijpen')}],
 [255,()=>{lightning('mild');text('Al je kansen zijn verkeken')}],
 [266,()=>{lightning(null);text('Je hebt er meerdere gekregen')}],
 [278,()=>{world('#sealWorld');text('');setTimeout(()=>$('#seal').classList.add('full'),1800)}],
 [310,()=>$('#seal').classList.add('fade')],
 [323,()=>{world('#completeWorld');setTimeout(()=>$('#completeText').classList.add('show'),100)}]
];
function loop(){
 const t=song.currentTime;
 while(idx<timeline.length&&t>=timeline[idx][0]){timeline[idx][1]();idx++}
 raf=requestAnimationFrame(loop)
}
$('#startLevel').addEventListener('click',async()=>{
 try{
  await audio().resume();
  song.currentTime=0;await song.play();
  showScreen('#cinema');idx=0;cancelAnimationFrame(raf);loop();
 }catch(e){$('#startLevel').textContent='TIK NOGMAALS OM TE STARTEN'}
});
</script>
</body>
</html>
