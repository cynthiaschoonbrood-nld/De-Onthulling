<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>De Onthulling — Level 3</title>
<style>
:root{--gold:#d8b56c;--gold2:#ffe2a1;--white:#f7f2e9;--muted:#8f887b;--dark:#020202}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020202;color:var(--white);overflow:hidden;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}#app{position:relative;width:100%;height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#17120b 0,#070604 28%,#020202 65%);isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.grain{position:absolute;inset:-30%;z-index:2;opacity:.045;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:4px 4px;animation:grain 8s steps(10) infinite;pointer-events:none}.vignette{position:absolute;inset:0;z-index:9;box-shadow:inset 0 0 22vw #000;pointer-events:none}
.screen{position:absolute;inset:0;z-index:4;display:grid;place-items:center;align-content:center;text-align:center;padding:28px;opacity:0;transform:scale(.98);pointer-events:none;transition:opacity .85s ease,transform 1.1s ease}.screen.active{opacity:1;transform:scale(1);pointer-events:auto}
.kicker{font-size:.67rem;letter-spacing:.38em;color:var(--gold);margin:0 0 20px}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:0}h1{font-size:clamp(3rem,12vw,7.4rem);letter-spacing:.075em;line-height:.92;text-shadow:0 0 50px rgba(216,181,108,.16)}h2{font-size:clamp(2.15rem,8vw,4.5rem);letter-spacing:.045em}
.sub{margin-top:22px;color:var(--muted);font-size:.75rem;letter-spacing:.24em}.line{height:1px;width:0;margin:0 auto 30px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);box-shadow:0 0 25px rgba(255,226,161,.7)}.line.draw{animation:draw 2.1s ease forwards}.authorized{font-size:.68rem;letter-spacing:.5em;color:var(--gold2);opacity:0;margin-bottom:25px}.authorized.show{animation:auth 2.1s ease forwards}.logo{opacity:0;filter:blur(12px);transform:scale(.82)}.logo.show{animation:logo 2.25s cubic-bezier(.16,.8,.24,1) forwards}.start{margin-top:48px;padding:16px 31px;border:1px solid rgba(216,181,108,.72);border-radius:999px;background:rgba(216,181,108,.08);color:var(--white);letter-spacing:.18em;font-size:.71rem;cursor:pointer;box-shadow:0 0 42px rgba(216,181,108,.09);opacity:0;pointer-events:none;transition:.8s ease}.start.ready{opacity:1;pointer-events:auto}.hint{opacity:0;color:var(--muted);font-size:.76rem;margin-top:16px;transition:1s ease}.hint.show{opacity:1}
.protocol{width:min(86vw,570px)}.log{height:235px;display:grid;align-content:center;gap:17px;text-align:left;font-size:.8rem;letter-spacing:.065em;color:#d4cec4}.entry{opacity:0;transform:translateY(8px)}.entry.show{animation:entry .65s ease forwards}.bar-shell{height:2px;background:rgba(255,255,255,.08);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 17px rgba(216,181,108,.75);transition:width .95s ease}
.count{font-family:Georgia,"Times New Roman",serif;font-size:clamp(10rem,42vw,21rem);line-height:.72;color:var(--gold2);text-shadow:0 0 65px rgba(216,181,108,.3);opacity:0}.count.hit{animation:countHit 1.15s cubic-bezier(.1,.85,.25,1) forwards}#countdown.impact1{animation:shake1 .5s ease}#countdown.impact2{animation:shake2 .62s ease}#countdown.impact3{animation:shake3 .75s ease}.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,226,161,.44),transparent 38%);opacity:0;pointer-events:none}.flash.go{animation:flash .7s ease}.ring{position:absolute;width:min(74vw,470px);aspect-ratio:1;border:1px solid rgba(255,226,161,.6);border-radius:50%;opacity:0;transform:scale(.2)}.ring.go{animation:ring 1s ease-out}
/* LEVEL 3 */
#reveal{padding:0;background:radial-gradient(circle at 50% 46%,rgba(82,47,12,.13),transparent 48%)}.stage{position:relative;width:100%;height:100%;overflow:hidden}.smoke{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 60%,rgba(120,95,62,.11),transparent 34%),radial-gradient(ellipse at 70% 35%,rgba(105,81,49,.09),transparent 31%);filter:blur(26px);animation:smoke 12s ease-in-out infinite alternate}
.flame{position:absolute;bottom:-3vh;width:clamp(120px,20vw,230px);height:clamp(110px,25vh,260px);z-index:8;opacity:0;transform-origin:50% 100%;filter:drop-shadow(0 0 28px rgba(255,100,0,.92));pointer-events:none}
.flame.left{left:-3vw;transform:rotate(13deg)}.flame.right{right:-3vw;transform:rotate(-13deg)}
.flame .nozzle{position:absolute;bottom:0;left:50%;width:clamp(72px,10vw,118px);height:clamp(28px,4.6vw,48px);transform:translateX(-50%);border-radius:13px 13px 4px 4px;background:linear-gradient(90deg,#151515 0,#6f6f6f 18%,#171717 42%,#9c7844 65%,#252525 88%,#090909 100%);border:2px solid #090909;box-shadow:inset 0 2px 4px rgba(255,255,255,.22),0 8px 18px rgba(0,0,0,.78),0 0 14px rgba(222,155,52,.32)}
.flame .nozzle::before{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:58%;height:18px;border-radius:50%;background:radial-gradient(ellipse,#080808 0 35%,#bb7b2d 42%,#3b250e 69%,#080808 75%);box-shadow:0 0 10px rgba(255,126,0,.72)}
.flame .jet{position:absolute;left:50%;bottom:29px;width:72%;height:0;opacity:0;transform:translateX(-50%);transform-origin:50% 100%;border-radius:48% 52% 28% 72%/72% 70% 30% 28%;background:radial-gradient(ellipse at 50% 84%,#fff 0 5%,#fff2a4 7% 14%,#ffd34f 18% 27%,#ff8a00 38%,#f03b00 58%,rgba(124,0,0,.45) 72%,transparent 76%);mix-blend-mode:screen;filter:blur(.3px);box-shadow:0 0 26px #ff9500,0 0 72px rgba(255,71,0,.88)}
.flame .jet::before,.flame .jet::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);transform-origin:50% 100%;border-radius:50% 50% 24% 76%/72% 68% 32% 28%;background:radial-gradient(ellipse at 50% 82%,#fff7be 0 8%,#ffcf3d 18%,#ff7300 43%,#d42500 65%,transparent 72%)}
.flame .jet::before{width:62%;height:92%;animation:jetFlicker .09s infinite alternate}.flame .jet::after{width:38%;height:76%;filter:blur(1px);animation:jetFlicker .065s infinite alternate-reverse}
.flame.burst{animation:cannonKick 4.6s ease-out forwards}.flame.burst .jet{animation:jetBurst 4.6s cubic-bezier(.2,.8,.2,1) forwards}
.flame .sparks{position:absolute;left:50%;bottom:64px;width:10px;height:10px;border-radius:50%;opacity:0;box-shadow:-62px -30px 0 #ffd36b,48px -52px 0 #ff9b22,-28px -88px 0 #fff0a1,72px -108px 0 #ff7a00,-75px -132px 0 #ffc34a,24px -155px 0 #fff2b8,86px -180px 0 #ff8a00,-40px -205px 0 #ffd15c}
.flame.burst .sparks{animation:sparkSpray 4.2s ease-out forwards}
.guest-stage{position:absolute;inset:0;display:grid;place-items:center;z-index:4;opacity:0;transition:opacity 1s ease}.guest-stage.show{opacity:1}

.scroll.unroll{animation:unroll 2.1s cubic-bezier(.18,.78,.22,1) forwards!important}
.scroll-inner{position:absolute;inset:13% 16% 14%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3%;text-align:center}
.dh-stamp{width:clamp(66px,9vw,92px);aspect-ratio:1;border:3px double rgba(92,38,15,.9);border-radius:50%;display:grid;place-items:center;color:#6e2917;transform:rotate(-7deg) scale(.82);opacity:0;filter:blur(8px);box-shadow:inset 0 0 0 3px rgba(111,45,20,.18),0 0 0 1px rgba(95,36,15,.45);font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:clamp(1.55rem,4vw,2.45rem);letter-spacing:-.12em;text-indent:-.12em;text-shadow:0 1px 0 rgba(255,220,156,.45)}
.dh-stamp::before{content:"DE ONTHULLING";position:absolute;font-family:Arial,sans-serif;font-size:clamp(.34rem,.8vw,.48rem);letter-spacing:.18em;transform:translateY(-27px);color:#6e2917}.dh-stamp.reveal{animation:stampIn 1.15s cubic-bezier(.16,.86,.25,1) forwards}
.scroll-title{margin-top:8%;font-family:"Edwardian Script ITC","Palace Script MT","Brush Script MT","Segoe Script",cursive;font-size:clamp(2.6rem,7.4vw,5.2rem);line-height:.9;color:#5c2a13;text-shadow:0 1px 0 rgba(255,225,166,.68),0 0 1px #3d190b;opacity:0;filter:blur(10px);transform:scale(.85) rotate(-1deg)}
.scroll-title.write{animation:writeIn 1.8s ease forwards!important}
.guest{position:absolute;margin:0;width:clamp(76px,15vw,150px);aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:0;filter:blur(18px) brightness(.45);transform:scale(.72);border:1px solid rgba(255,226,161,.4);box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 32px rgba(216,181,108,.25);z-index:4}.guest img{width:100%;height:100%;object-fit:cover}.guest.active{animation:guestCycle 4.6s ease-in-out forwards!important}.guest-1{left:9%;top:7%}.guest-2{left:42%;top:3%}.guest-3{right:8%;top:8%}.guest-4{left:3%;top:38%}.guest-5{right:3%;top:38%}.guest-6{left:8%;bottom:8%}.guest-7{left:42%;bottom:3%}.guest-8{left:24%;bottom:2%}.guest-9{right:24%;bottom:2%;z-index:4}.guest-9.active{animation:guestCycle 4.6s ease-in-out forwards!important}
#fireworkText{position:absolute;inset:0;z-index:6;display:grid;place-items:center;opacity:0;pointer-events:none}#fireworkText.show{animation:textReveal 2s ease forwards}.message{max-width:min(88vw,800px);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(1.75rem,6.2vw,4.5rem);line-height:1.25;color:#f7d98d;text-shadow:0 0 18px rgba(255,226,161,.6),0 0 60px rgba(216,181,108,.34);padding:22px}.hidden-dh{position:absolute;font-family:Georgia,serif;font-weight:700;font-size:clamp(2rem,7vw,5rem);letter-spacing:-.24em;color:rgba(255,226,161,.24);text-shadow:0 0 18px rgba(255,215,120,.4);transform:rotate(-8deg) translate(-18vw,-13vh)}
#construction{background:radial-gradient(circle at 50% 52%,#181108 0,#060503 54%,#020202 100%)}.construction-wrap{position:relative;width:min(90vw,760px);display:grid;place-items:center;gap:16px}.construction-title{font-family:Georgia,serif;font-size:clamp(2.2rem,9vw,5.5rem);letter-spacing:.09em;color:var(--gold2);text-shadow:0 0 40px rgba(216,181,108,.25)}.construction-sub{font-family:Georgia,serif;font-style:italic;font-size:clamp(1.1rem,4vw,2rem);color:var(--gold);letter-spacing:.08em}.crane{width:min(58vw,330px);height:auto;filter:drop-shadow(0 0 15px rgba(216,181,108,.25));animation:craneFloat 3s ease-in-out infinite}.hook{animation:hook 2.8s ease-in-out infinite;transform-origin:203px 66px}.mystery{margin-top:8px;font-size:.66rem;letter-spacing:.35em;color:#7d6a47;opacity:.8}

@keyframes grain{to{transform:translate3d(3%,2%,0)}}@keyframes draw{to{width:min(78vw,540px)}}@keyframes auth{0%{opacity:0}28%,68%{opacity:1}100%{opacity:0}}@keyframes logo{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes entry{to{opacity:1;transform:none}}@keyframes countHit{0%{opacity:0;filter:blur(18px);transform:scale(.42)}30%{opacity:1;filter:blur(0);transform:scale(1.17)}100%{opacity:1;transform:scale(1)}}@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.45)}}@keyframes shake1{15%{transform:translate(3px,-2px) scale(1.01)}35%{transform:translate(-3px,2px)}100%{transform:none}}@keyframes shake2{10%{transform:translate(7px,-5px) scale(1.022)}25%{transform:translate(-7px,5px)}45%{transform:translate(4px,-2px)}100%{transform:none}}@keyframes shake3{8%{transform:translate(12px,-8px) scale(1.04)}20%{transform:translate(-11px,8px)}34%{transform:translate(8px,-5px)}48%{transform:translate(-5px,3px)}100%{transform:none}}@keyframes smoke{to{transform:translate3d(4%,-2%,0) scale(1.05)}}@keyframes cannonKick{0%{opacity:0}5%{opacity:1}14%{filter:drop-shadow(0 0 48px #ff6400)}34%{transform:translateY(7px) scale(.98)}100%{opacity:0}}@keyframes jetBurst{0%{height:0;opacity:0}6%{height:88vh;opacity:1}18%{height:64vh}27%{height:82vh}42%{height:58vh}52%{height:78vh}67%{height:66vh}80%{height:86vh;opacity:1}100%{height:0;opacity:0}}@keyframes jetFlicker{to{transform:translateX(-50%) scaleX(.78) rotate(-4deg)}}@keyframes sparkSpray{0%,5%{opacity:0;transform:translate(-50%,0) scale(.3)}12%{opacity:1}55%{opacity:.95;transform:translate(-50%,-42px) scale(1.25)}100%{opacity:0;transform:translate(-50%,-120px) scale(.55)}}@keyframes stampIn{0%{opacity:0;filter:blur(8px);transform:rotate(-18deg) scale(1.7)}65%{opacity:1;filter:blur(0);transform:rotate(-5deg) scale(.95)}100%{opacity:.9;filter:blur(0);transform:rotate(-7deg) scale(1)}}@keyframes unroll{0%{opacity:0;transform:translate(-50%,-50%) scaleY(.03)}18%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scaleY(1)}}@keyframes writeIn{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes guestCycle{0%{opacity:0;filter:blur(18px) brightness(.45);transform:scale(.72)}24%,62%{opacity:1;filter:blur(0) brightness(1);transform:scale(1)}100%{opacity:0;filter:blur(16px) brightness(.45);transform:scale(.78)}}@keyframes guestCenter{0%{opacity:0;filter:blur(18px);transform:translate(-50%,-50%) scale(.72)}24%,62%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}100%{opacity:0;filter:blur(16px);transform:translate(-50%,-50%) scale(.78)}}@keyframes textReveal{to{opacity:1}}@keyframes craneFloat{50%{transform:translateY(-4px)}}@keyframes hook{50%{transform:translateY(13px)}}

#reveal .scroll{z-index:50!important}
#reveal .guest{z-index:40!important}

const screens=[...document.querySelectorAll('.screen')]; function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));}
let ac; function audio(){if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();}

  await sleep(2300);

  const stamp=$('#dhStamp');
  stamp.classList.add('reveal');
  tone(105,.32,'triangle',.07);
  await sleep(800);

  const title=$('#scrollTitle');
  title.classList.add('writing');
  tone(620,.08,'triangle',.025);
  const inkTicks=setInterval(()=>tone(420+Math.random()*90,.035,'sine',.008),180);
  await sleep(4200);
  clearInterval(inkTicks);

  const guests=[...document.querySelectorAll('.guest')];
  for(const g of guests){
    g.style.transition='opacity 1.15s ease, filter 1.15s ease, transform 1.15s ease';
    g.style.opacity='0';
    g.style.filter='blur(18px) brightness(.45)';
    g.style.transform='scale(.72)';
    void g.offsetWidth;
    g.style.opacity='1';
    g.style.filter='blur(0) brightness(1)';
    g.style.transform='scale(1)';
    whoosh();
    await sleep(2350);
    g.style.opacity='0';
    g.style.filter='blur(16px) brightness(.45)';
    g.style.transform='scale(.78)';
    await sleep(1150);
  }

  await sleep(700);
  guestStage.style.transition='opacity 1.5s ease';
  guestStage.style.opacity='0';
  await sleep(1600);

  startFireworks();
  boom(true);
  await sleep(700);
  const fw=$('#fireworkText');
  fw.style.opacity='1';
  fw.classList.add('show');
  await sleep(7600);
  show('construction');
  tone(196,.5,'sine',.08);
  await sleep(1000);
  tone(247,.7,'sine',.06);
}
