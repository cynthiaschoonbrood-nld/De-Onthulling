<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>De Onthulling — Level 3</title>
<style>
:root{--gold:#d8b56c;--gold2:#ffe2a1;--paper:#3d2415;--white:#f7f2e9;--muted:#8f887b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020202;color:var(--white);overflow:hidden;font-family:Arial,Helvetica,sans-serif}button{font:inherit}
#app{position:relative;width:100%;height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#17120b 0,#070604 28%,#020202 65%);isolation:isolate;overflow:hidden}
#fx,#fw{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.grain{position:absolute;inset:-30%;z-index:2;opacity:.045;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:4px 4px;animation:grain 8s steps(10) infinite;pointer-events:none}.vignette{position:absolute;inset:0;z-index:60;box-shadow:inset 0 0 22vw #000;pointer-events:none}
.screen{position:absolute;inset:0;z-index:4;display:grid;place-items:center;align-content:center;text-align:center;padding:28px;opacity:0;visibility:hidden;transform:scale(.985);pointer-events:none;transition:opacity .75s ease,transform 1s ease,visibility 0s .75s}.screen.active{opacity:1;visibility:visible;transform:scale(1);pointer-events:auto;transition-delay:0s}
.kicker{font-size:.67rem;letter-spacing:.38em;color:var(--gold);margin:0 0 20px}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:0}h1{font-size:clamp(3rem,12vw,7.4rem);letter-spacing:.075em;line-height:.92;text-shadow:0 0 50px rgba(216,181,108,.16)}.sub{margin-top:22px;color:var(--muted);font-size:.75rem;letter-spacing:.24em}.line{height:1px;width:0;margin:0 auto 30px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);box-shadow:0 0 25px rgba(255,226,161,.7)}.line.draw{animation:draw 2.1s ease forwards}.authorized{font-size:.68rem;letter-spacing:.5em;color:var(--gold2);opacity:0;margin-bottom:25px}.authorized.show{animation:auth 2.1s ease forwards}.logo{opacity:0;filter:blur(12px);transform:scale(.82)}.logo.show{animation:logo 2.25s cubic-bezier(.16,.8,.24,1) forwards}.start{margin-top:48px;padding:16px 31px;border:1px solid rgba(216,181,108,.72);border-radius:999px;background:rgba(216,181,108,.08);color:var(--white);letter-spacing:.18em;font-size:.71rem;cursor:pointer;box-shadow:0 0 42px rgba(216,181,108,.09);opacity:0;pointer-events:none;transition:.8s ease}.start.ready{opacity:1;pointer-events:auto}.hint{opacity:0;color:var(--muted);font-size:.76rem;margin-top:16px;transition:1s ease}.hint.show{opacity:1}
.protocol{width:min(86vw,570px)}.log{height:235px;display:grid;align-content:center;gap:17px;text-align:left;font-size:.8rem;letter-spacing:.065em;color:#d4cec4}.entry{opacity:0;transform:translateY(8px)}.entry.show{animation:entry .65s ease forwards}.bar-shell{height:2px;background:rgba(255,255,255,.08);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 17px rgba(216,181,108,.75);transition:width .95s ease}.count{font-family:Georgia,"Times New Roman",serif;font-size:clamp(10rem,42vw,21rem);line-height:.72;color:var(--gold2);text-shadow:0 0 65px rgba(216,181,108,.3);opacity:0}.count.hit{animation:countHit 1.15s cubic-bezier(.1,.85,.25,1)}.flash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle,#fff8d8 0,#ffd36c 20%,rgba(255,155,25,.45) 44%,transparent 70%);opacity:0;pointer-events:none}.flash.go{animation:flash .78s ease}.ring{position:absolute;width:min(74vw,470px);aspect-ratio:1;border:1px solid rgba(255,226,161,.6);border-radius:50%;opacity:0;transform:scale(.2)}.ring.go{animation:ring 1s ease-out}
/* echte vuurvideo zonder zichtbare rechthoeken */
#fireScene{background:radial-gradient(ellipse at 50% 92%,rgba(255,92,0,.22),transparent 48%)}.fire-wrap{position:absolute;inset:0;overflow:hidden}.fire{position:absolute;bottom:-7vh;width:min(39vw,370px);height:90vh;object-fit:cover;object-position:center;mix-blend-mode:screen;filter:saturate(1.5) contrast(1.36) brightness(1.22);opacity:0;-webkit-mask-image:radial-gradient(ellipse 44% 62% at 50% 65%,#000 0 55%,transparent 88%);mask-image:radial-gradient(ellipse 44% 62% at 50% 65%,#000 0 55%,transparent 88%)}.fire.left{left:-4vw}.fire.right{right:-4vw;transform:scaleX(-1)}.fire.blast{animation:blast 1.5s cubic-bezier(.1,.76,.2,1) both}.fire.right.blast{animation-name:blastR}.stage-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,112,15,.32),transparent 58%);opacity:0}.stage-glow.on{animation:glow 1.5s ease}
/* perkament */
#guestScene{background:radial-gradient(ellipse at center,#26170d 0,#060403 64%,#000 100%)}.scroll-shell{position:absolute;left:50%;top:50%;width:min(70vw,880px);transform:translate(-50%,-50%);filter:drop-shadow(0 24px 30px #000);clip-path:inset(0 49% 0 49%);opacity:0}.scroll-shell.open{animation:unroll 2.4s cubic-bezier(.18,.82,.18,1) forwards}.scroll-shell img{width:100%;display:block}.seal{position:absolute;left:50%;top:21%;width:clamp(70px,9vw,112px);transform:translate(-50%,-50%) scale(.65);opacity:0;filter:drop-shadow(0 7px 9px rgba(0,0,0,.45))}.seal.show{animation:sealIn .95s ease forwards}.guesttitle{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);font:italic clamp(2.8rem,7vw,6.2rem) "Segoe Script","Brush Script MT",cursive;color:#3d2113;white-space:nowrap;text-shadow:0 1px rgba(255,226,161,.3);clip-path:inset(0 100% 0 0);opacity:0}.guesttitle.write{animation:ink 3.7s cubic-bezier(.25,.05,.2,1) forwards}.inkshine{position:absolute;left:25%;right:25%;top:61%;height:1px;background:linear-gradient(90deg,transparent,rgba(61,33,19,.5),transparent);opacity:0}.inkshine.show{animation:inkline 2.8s 2.2s ease forwards}
.portrait{position:absolute;width:clamp(78px,12vw,145px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,226,161,.8);box-shadow:0 0 25px rgba(216,181,108,.45),0 14px 28px rgba(0,0,0,.65);opacity:0;filter:blur(18px);transform:scale(.7);transition:opacity 1.15s ease,filter 1.45s ease,transform 1.45s ease}.portrait.show{opacity:1;filter:blur(0);transform:scale(1)}.portrait.hide{opacity:0;filter:blur(14px);transform:scale(.78)}
#finale{background:#010101}.finaltext{position:relative;z-index:4;text-align:center;color:var(--gold2);font:italic clamp(1.5rem,5vw,3.8rem) Georgia;max-width:900px;padding:2rem;opacity:0;text-shadow:0 0 24px rgba(255,226,161,.42),0 0 68px rgba(216,181,108,.25)}.finaltext.on{animation:fadeIn 1.8s forwards}.dhhidden{position:absolute;z-index:3;font:700 clamp(4rem,16vw,10rem) Georgia;color:var(--gold);opacity:0;text-shadow:0 0 40px #ffd87a}.dhhidden.on{animation:dhGlow 5s forwards}
#level4{text-align:center;background:radial-gradient(circle at 50% 70%,#1a1209,#020202 65%)}.crane{position:relative;width:min(44vw,340px);height:150px;margin:auto;color:var(--gold);opacity:.9}.crane:before{content:"";position:absolute;left:50%;bottom:0;width:8px;height:125px;background:linear-gradient(#f7dc91,#806222);transform:translateX(-50%)}.crane:after{content:"";position:absolute;left:50%;top:22px;width:72%;height:7px;background:linear-gradient(90deg,#806222,#f7dc91,#806222);transform:translateX(-10%)}.hook{position:absolute;left:74%;top:28px;width:1px;height:62px;background:var(--gold)}.hook:after{content:"";position:absolute;bottom:-10px;left:-5px;width:10px;height:10px;border:2px solid var(--gold);border-top:0;border-radius:0 0 8px 8px}#level4 h2{font:500 clamp(2.2rem,8vw,5rem) Georgia;color:var(--gold2);letter-spacing:.12em}#level4 p{color:var(--gold);letter-spacing:.25em;font-size:.8rem}
@keyframes grain{to{transform:translate3d(3%,2%,0)}}@keyframes draw{to{width:min(78vw,540px)}}@keyframes auth{0%{opacity:0}28%,68%{opacity:1}100%{opacity:0}}@keyframes logo{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes entry{to{opacity:1;transform:none}}@keyframes countHit{0%{opacity:0;filter:blur(18px);transform:scale(.42)}30%{opacity:1;filter:blur(0);transform:scale(1.17)}100%{opacity:1;transform:scale(1)}}@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.45)}}@keyframes blast{0%{opacity:0;transform:translateY(22%) scale(.72)}13%{opacity:1;transform:translateY(0) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:translateY(-4%) scale(.98)}}@keyframes blastR{0%{opacity:0;transform:scaleX(-1) translateY(22%) scale(.72)}13%{opacity:1;transform:scaleX(-1) translateY(0) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:scaleX(-1) translateY(-4%) scale(.98)}}@keyframes glow{0%,100%{opacity:0}15%,70%{opacity:1}}@keyframes unroll{0%{opacity:0;clip-path:inset(0 49% 0 49%);transform:translate(-50%,-50%) scale(.96)}12%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);transform:translate(-50%,-50%) scale(1)}}@keyframes sealIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes ink{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes inkline{0%{opacity:0;transform:scaleX(.2)}40%{opacity:.55}100%{opacity:0;transform:scaleX(1)}}@keyframes fadeIn{to{opacity:1}}@keyframes dhGlow{12%{opacity:.18}48%{opacity:.58}100%{opacity:.08}}
@media(max-width:700px){.scroll-shell{width:96vw;top:47%}.seal{top:27%;width:72px}.guesttitle{top:49%;font-size:clamp(2.25rem,12vw,4rem)}.portrait{width:21vw}.fire{width:56vw;height:78vh}.fire.left{left:-18vw}.fire.right{right:-18vw}}
</style>
</head><body><main id="app"><canvas id="fx"></canvas><canvas id="fw"></canvas><div class="grain"></div><div class="vignette"></div><div id="flash" class="flash"></div>
<section id="boot" class="screen active"><div><div id="bootLine" class="line"></div><div id="bootAuth" class="authorized">AUTHORIZED</div><h1 id="bootLogo" class="logo">DE ONTHULLING</h1><p id="bootSub" class="sub" style="opacity:0">LEVEL 3</p><button id="open" class="start">OPEN LEVEL</button><p id="hint" class="hint">Zet je geluid aan voor de volledige ervaring.</p></div></section>
<section id="protocol" class="screen"><div class="protocol"><p class="kicker">THE REVEAL PROTOCOL</p><div id="log" class="log"></div><div class="bar-shell"><div id="bar" class="bar"></div></div></div></section>
<section id="countdown" class="screen"><div id="ring" class="ring"></div><div><p class="kicker">LEVEL WORDT VRIJGEGEVEN</p><div id="count" class="count">3</div></div></section>
<section id="fireScene" class="screen"><div class="fire-wrap"><video id="fireL" class="fire left" src="fire.mp4" muted playsinline preload="auto"></video><video id="fireR" class="fire right" src="fire.mp4" muted playsinline preload="auto"></video><div id="stageGlow" class="stage-glow"></div></div></section>
<section id="guestScene" class="screen"><div id="scroll" class="scroll-shell"><img src="parchment.png" alt="Oude perkamentrol"><img id="seal" class="seal" src="dh-seal.png" alt="DH-zegel"><div id="guestTitle" class="guesttitle">Gastenlijst</div><div id="inkshine" class="inkshine"></div></div></section>
<section id="finale" class="screen"><div id="dh" class="dhhidden">DH</div><div id="finalText" class="finaltext">..We willen dat je bij ons bent als de Show begint..</div></section>
<section id="level4" class="screen"><div><div class="crane"><span class="hook"></span></div><h2>LEVEL 4</h2><p>ER WORDT AAN GEBOUWD...</p></div></section>
</main><script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));const screens=[...document.querySelectorAll('.screen')];function show(id){screens.forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
let ac;function audio(){ac??=new(window.AudioContext||window.webkitAudioContext)();return ac}function tone(freq,dur,type='sine',gain=.1,delay=0){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,a.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur)}function noise(dur=.8,gain=.18,delay=0,cut=1200){const a=audio(),b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.value=gain;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+delay)}function boom(){noise(1.55,.46,0,850);tone(48,1.5,'sine',.38);tone(82,.9,'triangle',.17)}function fireWhoosh(){noise(1.1,.34,0,2600);tone(115,.65,'sawtooth',.055)}function fireworkSound(){for(let i=0;i<9;i++){const d=i*.52+Math.random()*.16;noise(.75,.24,d,1200);tone(52+Math.random()*70,.72,'sine',.17,d);for(let j=0;j<12;j++)tone(1100+Math.random()*2500,.16,'square',.012,d+.1+Math.random()*.55)}}function flash(){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
const positions=[[4,12],[82,11],[2,58],[84,58],[14,76],[72,76],[18,0],[67,0],[43,77]];for(let i=1;i<=9;i++){const img=new Image();img.className='portrait';img.src=String(i).padStart(2,'0')+'.jpg';img.style.left=positions[i-1][0]+'%';img.style.top=positions[i-1][1]+'%';$('#guestScene').appendChild(img)}
async function blastFire(){const vids=[$('#fireL'),$('#fireR')],glow=$('#stageGlow');for(const v of vids){v.pause();v.currentTime=0;v.classList.remove('blast');void v.offsetWidth;v.classList.add('blast');v.play().catch(()=>{})}glow.classList.remove('on');void glow.offsetWidth;glow.classList.add('on');fireWhoosh();if(navigator.vibrate)navigator.vibrate([80,25,110]);await sleep(1550)}
async function run(){show('#protocol');const steps=[['Protocol gestart...',18],['Beveiligde verbinding opgebouwd...',38],['Authenticatie voltooid.',58],['Nieuw level gedetecteerd.',78],['Level 3 wordt vrijgegeven...',100]];for(const [text,p] of steps){const e=document.createElement('div');e.className='entry';e.textContent=text;$('#log').appendChild(e);requestAnimationFrame(()=>e.classList.add('show'));$('#bar').style.width=p+'%';tone(520+p*2,.12,'sine',.035);await sleep(1030)}await sleep(350);show('#countdown');for(const n of [3,2,1]){const c=$('#count');c.textContent=n;c.classList.remove('hit');void c.offsetWidth;c.classList.add('hit');tone(120+n*35,.35,'sine',.16);await sleep(1550)}flash();boom();await sleep(300);show('#fireScene');await blastFire();await sleep(160);await blastFire();await sleep(120);await blastFire();await sleep(480);show('#guestScene');$('#scroll').classList.add('open');await sleep(2500);$('#seal').classList.add('show');await sleep(1050);$('#guestTitle').classList.add('write');$('#inkshine').classList.add('show');await sleep(3900);const pics=[...document.querySelectorAll('.portrait')];for(const p of pics){p.classList.add('show');tone(610,.15,'sine',.03);await sleep(1750);p.classList.add('hide');await sleep(500)}await sleep(600);show('#finale');startFireworks();fireworkSound();$('#dh').classList.add('on');await sleep(1500);$('#finalText').classList.add('on');await sleep(6700);stopFireworks();show('#level4');tone(260,.7,'sine',.075)}
setTimeout(()=>{$('#bootLine').classList.add('draw');$('#bootAuth').classList.add('show');setTimeout(()=>$('#bootLogo').classList.add('show'),900);setTimeout(()=>{$('#bootSub').style.transition='opacity 1s';$('#bootSub').style.opacity=1},2300);setTimeout(()=>{$('#open').classList.add('ready');$('#hint').classList.add('show')},3500)},250);$('#open').addEventListener('click',async()=>{await audio().resume();$('#open').disabled=true;run()});
const c=$('#fw'),ctx=c.getContext('2d');let parts=[],fw=false,timer;function size(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function burst(){const cx=innerWidth*(.12+Math.random()*.76),cy=innerHeight*(.13+Math.random()*.48);for(let i=0;i<115;i++){const a=Math.random()*Math.PI*2,s=1.2+Math.random()*5.4;parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:.6+Math.random()*1.9})}}function startFireworks(){fw=true;burst();timer=setInterval(()=>fw&&burst(),620);draw()}function stopFireworks(){fw=false;clearInterval(timer)}function draw(){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,innerWidth,innerHeight);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.life-=.013;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=Math.random()>.18?'#ffd978':'#fff3c4';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}parts=parts.filter(p=>p.life>0);ctx.globalAlpha=1;if(fw||parts.length)requestAnimationFrame(draw)}
</script></body></html>
