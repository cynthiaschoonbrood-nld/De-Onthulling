<html lang="nl">
<head>

<title>De Onthulling — Level 3</title>
<style>
:root{--gold:#d8b56c;--gold2:#ffe2a1;--white:#f7f2e9;--muted:#8f887b;--dark:#020202}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020202;color:var(--white);overflow:hidden;font-family:Arial,Helvetica,sans-serif}
button{font:inherit}#app{position:relative;width:100%;height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#17120b 0,#070604 28%,#020202 65%);isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.grain{position:absolute;inset:-30%;z-index:2;opacity:.045;background-image:radial-gradient(#fff .55px,transparent .55px);background-size:4px 4px;animation:grain 8s steps(10) infinite;pointer-events:none}.vignette{position:absolute;inset:0;z-index:9;box-shadow:inset 0 0 22vw #000;pointer-events:none}
.screen{position:absolute;inset:0;z-index:4;display:grid;place-items:center;align-content:center;text-align:center;padding:28px;opacity:0;transform:scale(.98);pointer-events:none;transition:opacity .85s ease,transform 1.1s ease}.screen.active{opacity:1;transform:scale(1);pointer-events:auto}
.kicker{font-size:.67rem;letter-spacing:.38em;color:var(--gold);margin:0 0 20px}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:0}h1{font-size:clamp(3rem,12vw,7.4rem);letter-spacing:.075em;line-height:.92;text-shadow:0 0 50px rgba(216,181,108,.16)}h2{font-size:clamp(2.15rem,8vw,4.5rem);letter-spacing:.045em}
.sub{margin-top:22px;color:var(--muted);font-size:.75rem;letter-spacing:.24em}.line{height:1px;width:0;margin:0 auto 30px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);box-shadow:0 0 25px rgba(255,226,161,.7)}.line.draw{animation:draw 2.1s ease forwards}.authorized{font-size:.68rem;letter-spacing:.5em;color:var(--gold2);opacity:0;margin-bottom:25px}.authorized.show{animation:auth 2.1s ease forwards}.logo{opacity:0;filter:blur(12px);transform:scale(.82)}.logo.show{animation:logo 2.25s cubic-bezier(.16,.8,.24,1) forwards}.start{margin-top:48px;padding:16px 31px;border:1px solid rgba(216,181,108,.72);border-radius:999px;background:rgba(216,181,108,.08);color:var(--white);letter-spacing:.18em;font-size:.71rem;cursor:pointer;box-shadow:0 0 42px rgba(216,181,108,.09);opacity:0;pointer-events:none;transition:.8s ease}.start.ready{opacity:1;pointer-events:auto}.hint{opacity:0;color:var(--muted);font-size:.76rem;margin-top:16px;transition:1s ease}.hint.show{opacity:1}
.protocol{width:min(86vw,570px)}.log{height:235px;display:grid;align-content:center;gap:17px;text-align:left;font-size:.8rem;letter-spacing:.065em;color:#d4cec4}.entry{opacity:0;transform:translateY(8px)}.entry.show{animation:entry .65s ease forwards}.bar-shell{height:2px;background:rgba(255,255,255,.08);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 17px rgba(216,181,108,.75);transition:width .95s ease}
.count{font-family:Georgia,"Times New Roman",serif;font-size:clamp(10rem,42vw,21rem);line-height:.72;color:var(--gold2);text-shadow:0 0 65px rgba(216,181,108,.3);opacity:0}.count.hit{animation:countHit 1.15s cubic-bezier(.1,.85,.25,1)}#countdown.impact1{animation:shake1 .5s ease}#countdown.impact2{animation:shake2 .62s ease}#countdown.impact3{animation:shake3 .75s ease}.flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,226,161,.44),transparent 38%);opacity:0;pointer-events:none}.flash.go{animation:flash .7s ease}.ring{position:absolute;width:min(74vw,470px);aspect-ratio:1;border:1px solid rgba(255,226,161,.6);border-radius:50%;opacity:0;transform:scale(.2)}.ring.go{animation:ring 1s ease-out}
/* LEVEL 3 */
#reveal{padding:0;background:radial-gradient(circle at 50% 46%,rgba(82,47,12,.13),transparent 48%)}.stage{position:relative;width:100%;height:100%;overflow:hidden}.smoke{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 60%,rgba(120,95,62,.11),transparent 34%),radial-gradient(ellipse at 70% 35%,rgba(105,81,49,.09),transparent 31%);filter:blur(26px);animation:smoke 12s ease-in-out infinite alternate}
.flame{position:absolute;bottom:-10vh;width:clamp(68px,14vw,155px);height:0;z-index:5;opacity:0;filter:drop-shadow(0 0 25px #ff7a00)}.flame.left{left:-2vw}.flame.right{right:-2vw}.flame.burst{animation:flameBurst 3.7s ease-in-out forwards}.flame::before,.flame::after{content:"";position:absolute;left:50%;bottom:0;transform-origin:50% 100%;border-radius:52% 48% 30% 70%/65% 62% 38% 35%;background:radial-gradient(circle at 50% 72%,#fff6bf 0 8%,#ffd36a 9% 22%,#ff8a00 37%,#d62e00 67%,transparent 70%);mix-blend-mode:screen}.flame::before{width:100%;height:100%;transform:translateX(-50%);animation:flicker .13s infinite alternate}.flame::after{width:65%;height:78%;transform:translateX(-50%) rotate(4deg);filter:blur(2px);animation:flicker .09s infinite alternate-reverse}
.guest-stage{position:absolute;inset:0;display:grid;place-items:center;z-index:4;opacity:0;transition:opacity 1s ease}.guest-stage.show{opacity:1}.scroll{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scaleY(.03);width:min(42vw,360px);height:min(48vh,430px);min-width:210px;min-height:250px;opacity:0;z-index:5;background:linear-gradient(90deg,#9e6b2d 0,#e6c27c 7%,#f4d998 18%,#e7c47e 82%,#ad7937 94%,#754616 100%);border:1px solid #8b5c20;box-shadow:0 0 65px rgba(216,181,108,.25),inset 0 0 45px rgba(90,44,8,.35);clip-path:polygon(4% 0,96% 0,100% 4%,97% 9%,100% 15%,97% 21%,100% 28%,97% 36%,100% 43%,97% 51%,100% 59%,97% 66%,100% 73%,97% 82%,100% 91%,96% 100%,4% 100%,0 95%,3% 87%,0 79%,3% 70%,0 62%,3% 54%,0 45%,3% 37%,0 29%,3% 20%,0 12%,3% 5%)}.scroll.unroll{animation:unroll 2.1s cubic-bezier(.18,.78,.22,1) forwards}.scroll::before,.scroll::after{content:"";position:absolute;left:-5%;width:110%;height:24px;border-radius:50%;background:linear-gradient(#6f4217,#b47a35 32%,#e1b56b 48%,#89541f 68%,#4b2a0e);box-shadow:0 6px 12px rgba(0,0,0,.5)}.scroll::before{top:-12px}.scroll::after{bottom:-12px;transform:rotate(180deg)}.scroll-inner{position:absolute;inset:34px 20px;display:grid;place-items:center;border:1px solid rgba(92,52,16,.28)}.scroll-inner::before,.scroll-inner::after{content:"❦";position:absolute;color:#80501e;font-size:2rem}.scroll-inner::before{top:14px}.scroll-inner::after{bottom:14px;transform:rotate(180deg)}.scroll-title{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(2.7rem,7vw,5.4rem);color:#5c3513;text-shadow:0 1px 0 #f8e1a5;opacity:0;filter:blur(10px);transform:scale(.85)}.scroll-title.write{animation:writeIn 1.8s ease forwards}
.guest{position:absolute;margin:0;width:clamp(76px,15vw,150px);aspect-ratio:1;border-radius:50%;overflow:hidden;opacity:0;filter:blur(18px) brightness(.45);transform:scale(.72);border:1px solid rgba(255,226,161,.4);box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 32px rgba(216,181,108,.25);z-index:4}.guest img{width:100%;height:100%;object-fit:cover}.guest.active{animation:guestCycle 4.4s ease-in-out forwards}.guest-1{left:9%;top:7%}.guest-2{left:42%;top:3%}.guest-3{right:8%;top:8%}.guest-4{left:3%;top:38%}.guest-5{right:3%;top:38%}.guest-6{left:8%;bottom:8%}.guest-7{left:42%;bottom:3%}.guest-8{right:8%;bottom:8%}.guest-9{left:50%;top:50%;transform:translate(-50%,-50%) scale(.72);z-index:7}.guest-9.active{animation:guestCenter 4.4s ease-in-out forwards}
#fireworkText{position:absolute;inset:0;z-index:6;display:grid;place-items:center;opacity:0;pointer-events:none}#fireworkText.show{animation:textReveal 2s ease forwards}.message{max-width:min(88vw,800px);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(1.75rem,6.2vw,4.5rem);line-height:1.25;color:#f7d98d;text-shadow:0 0 18px rgba(255,226,161,.6),0 0 60px rgba(216,181,108,.34);padding:22px}.hidden-dh{position:absolute;font-family:Georgia,serif;font-weight:700;font-size:clamp(2rem,7vw,5rem);letter-spacing:-.24em;color:rgba(255,226,161,.24);text-shadow:0 0 18px rgba(255,215,120,.4);transform:rotate(-8deg) translate(-18vw,-13vh)}
#construction{background:radial-gradient(circle at 50% 52%,#181108 0,#060503 54%,#020202 100%)}.construction-wrap{position:relative;width:min(90vw,760px);display:grid;place-items:center;gap:16px}.construction-title{font-family:Georgia,serif;font-size:clamp(2.2rem,9vw,5.5rem);letter-spacing:.09em;color:var(--gold2);text-shadow:0 0 40px rgba(216,181,108,.25)}.construction-sub{font-family:Georgia,serif;font-style:italic;font-size:clamp(1.1rem,4vw,2rem);color:var(--gold);letter-spacing:.08em}.crane{width:min(58vw,330px);height:auto;filter:drop-shadow(0 0 15px rgba(216,181,108,.25));animation:craneFloat 3s ease-in-out infinite}.hook{animation:hook 2.8s ease-in-out infinite;transform-origin:203px 66px}.mystery{margin-top:8px;font-size:.66rem;letter-spacing:.35em;color:#7d6a47;opacity:.8}
@keyframes grain{to{transform:translate3d(3%,2%,0)}}@keyframes draw{to{width:min(78vw,540px)}}@keyframes auth{0%{opacity:0}28%,68%{opacity:1}100%{opacity:0}}@keyframes logo{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes entry{to{opacity:1;transform:none}}@keyframes countHit{0%{opacity:0;filter:blur(18px);transform:scale(.42)}30%{opacity:1;filter:blur(0);transform:scale(1.17)}100%{opacity:1;transform:scale(1)}}@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.45)}}@keyframes shake1{15%{transform:translate(3px,-2px) scale(1.01)}35%{transform:translate(-3px,2px)}100%{transform:none}}@keyframes shake2{10%{transform:translate(7px,-5px) scale(1.022)}25%{transform:translate(-7px,5px)}45%{transform:translate(4px,-2px)}100%{transform:none}}@keyframes shake3{8%{transform:translate(12px,-8px) scale(1.04)}20%{transform:translate(-11px,8px)}34%{transform:translate(8px,-5px)}48%{transform:translate(-5px,3px)}100%{transform:none}}@keyframes smoke{to{transform:translate3d(4%,-2%,0) scale(1.05)}}@keyframes flameBurst{0%{height:0;opacity:0}12%{height:70vh;opacity:1}42%{height:52vh}72%{height:65vh;opacity:1}100%{height:0;opacity:0}}@keyframes flicker{to{transform:translateX(-50%) scaleX(.88) rotate(-3deg)}}@keyframes unroll{0%{opacity:0;transform:translate(-50%,-50%) scaleY(.03)}18%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scaleY(1)}}@keyframes writeIn{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes guestCycle{0%{opacity:0;filter:blur(18px) brightness(.45);transform:scale(.72)}24%,62%{opacity:1;filter:blur(0) brightness(1);transform:scale(1)}100%{opacity:0;filter:blur(16px) brightness(.45);transform:scale(.78)}}@keyframes guestCenter{0%{opacity:0;filter:blur(18px);transform:translate(-50%,-50%) scale(.72)}24%,62%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}100%{opacity:0;filter:blur(16px);transform:translate(-50%,-50%) scale(.78)}}@keyframes textReveal{to{opacity:1}}@keyframes craneFloat{50%{transform:translateY(-4px)}}@keyframes hook{50%{transform:translateY(13px)}}
@media(max-width:600px){.guest{width:clamp(68px,21vw,102px)}.guest-1{left:3%;top:8%}.guest-2{left:39%;top:2%}.guest-3{right:3%;top:8%}.guest-4{left:1%;top:40%}.guest-5{right:1%;top:40%}.guest-6{left:4%;bottom:8%}.guest-7{left:39%;bottom:2%}.guest-8{right:4%;bottom:8%}.scroll{width:min(46vw,260px);height:min(42vh,360px)}.scroll-title{font-size:clamp(2rem,10vw,3.3rem)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

let ac; function audio(){if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();}
function tone(freq=90,dur=.28,type='sine',gain=.18){audio();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);g.gain.setValueAtTime(gain,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}

function burst(x,y,count=75){for(let i=0;i<count;i++){let a=Math.PI*2*i/count+(Math.random()-.5)*.12,s=1.6+Math.random()*5.3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.009+Math.random()*.012,size:.8+Math.random()*2.1})}}
function startFireworks(){fireworks=true;let k=0;const id=setInterval(()=>{burst(W*(.16+Math.random()*.68),H*(.15+Math.random()*.43),65+Math.random()*45);tone(70+Math.random()*35,.18,'triangle',.025);if(++k>15){clearInterval(id);setTimeout(()=>fireworks=false,4000)}},420)}
(function loop(){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.vx*=.992;p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue}ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=`rgba(255,${Math.floor(180+60*p.life)},${Math.floor(70+80*p.life)},${p.life})`;ctx.fill()}ctx.globalCompositeOperation='source-over';requestAnimationFrame(loop)})();
</script></body></html>
