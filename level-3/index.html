<style>
:root{--gold:#d8b56c;--gold2:#ffe2a1;--paper:#3d2415;--white:#f7f2e9;--muted:#8f887b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020202;color:var(--white);overflow:hidden;font-family:Arial,Helvetica,sans-serif}button{font:inherit}
#app{position:relative;width:100%;height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#17120b 0,#070604 28%,#020202 65%);isolation:isolate;overflow:hidden}

.protocol{width:min(86vw,570px)}.log{height:235px;display:grid;align-content:center;gap:17px;text-align:left;font-size:.8rem;letter-spacing:.065em;color:#d4cec4}.entry{opacity:0;transform:translateY(8px)}.entry.show{animation:entry .65s ease forwards}.bar-shell{height:2px;background:rgba(255,255,255,.08);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 17px rgba(216,181,108,.75);transition:width .95s ease}.count{font-family:Georgia,"Times New Roman",serif;font-size:clamp(10rem,42vw,21rem);line-height:.72;color:var(--gold2);text-shadow:0 0 32px rgba(255,226,161,.55),0 0 88px rgba(216,181,108,.34);opacity:0;will-change:transform,filter}.count.hit{animation:countHit 1.28s cubic-bezier(.1,.85,.25,1)}.count.power3{--shake:2px}.count.power2{--shake:5px}.count.power1{--shake:9px;text-shadow:0 0 38px rgba(255,240,188,.82),0 0 120px rgba(216,181,108,.62)}.flash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle,#fff8d8 0,#ffd36c 20%,rgba(255,155,25,.45) 44%,transparent 70%);opacity:0;pointer-events:none}.flash.go{animation:flash .78s ease}.ring{position:absolute;width:min(74vw,470px);aspect-ratio:1;border:1px solid rgba(255,226,161,.6);border-radius:50%;opacity:0;transform:scale(.2)}.ring.go{animation:ring 1s ease-out}
/* echte vuurvideo zonder zichtbare rechthoeken */
#fireScene{background:radial-gradient(ellipse at 50% 92%,rgba(255,92,0,.22),transparent 48%)}.fire-wrap{position:absolute;inset:0;overflow:hidden}.fire{position:absolute;bottom:-7vh;width:min(39vw,370px);height:90vh;object-fit:cover;object-position:center;mix-blend-mode:screen;filter:saturate(1.5) contrast(1.36) brightness(1.22);opacity:0;-webkit-mask-image:radial-gradient(ellipse 44% 62% at 50% 65%,#000 0 55%,transparent 88%);mask-image:radial-gradient(ellipse 44% 62% at 50% 65%,#000 0 55%,transparent 88%)}.fire.left{left:-4vw}.fire.right{right:-4vw;transform:scaleX(-1)}.fire.blast{animation:blast 1.5s cubic-bezier(.1,.76,.2,1) both}.fire.right.blast{animation-name:blastR}.stage-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(255,112,15,.32),transparent 58%);opacity:0}.stage-glow.on{animation:glow 1.5s ease}
/* perkament — echte oude verticale rol */
#guestScene{background:radial-gradient(ellipse at center,rgba(59,38,18,.42) 0,#080503 58%,#000 100%)}.scroll-shell{position:absolute;left:50%;top:50%;width:min(43vw,390px);max-height:90vh;transform:translate(-50%,-50%) rotate(-2.2deg) scale(.92);filter:drop-shadow(0 26px 34px rgba(0,0,0,.82));clip-path:inset(49% 0 49% 0);opacity:0;transform-origin:center}.scroll-shell.open{animation:unrollVertical 2.35s cubic-bezier(.18,.82,.18,1) forwards}.scroll-shell>img:first-child{width:100%;display:block}.seal{position:absolute;left:50%;top:24%;width:clamp(34px,4.4vw,54px);transform:translate(-50%,-50%) scale(.78) rotate(2deg);opacity:0;filter:sepia(.25) saturate(.8) contrast(.92) drop-shadow(0 2px 3px rgba(0,0,0,.26))}.seal.show{animation:sealSubtle 1.15s ease forwards}.guesttitle{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%) rotate(2deg);font:italic clamp(2rem,4.7vw,4rem) "Segoe Script","Brush Script MT",cursive;color:#422515;white-space:nowrap;text-shadow:0 1px rgba(255,226,161,.22);clip-path:inset(0 100% 0 0);opacity:0}.guesttitle.write{animation:ink 3.7s cubic-bezier(.25,.05,.2,1) forwards}.guestnames{position:absolute;left:50%;top:52%;width:76%;transform:translateX(-50%) rotate(2deg);display:grid;gap:.5rem;text-align:center;color:#422515;font:italic clamp(1.05rem,2.2vw,1.75rem) "Segoe Script","Brush Script MT",cursive}.guestname{opacity:0;clip-path:inset(0 100% 0 0)}.guestname.write{animation:inkName 1.9s cubic-bezier(.25,.05,.2,1) forwards}.inkshine{position:absolute;left:27%;right:27%;top:46%;height:1px;background:linear-gradient(90deg,transparent,rgba(61,33,19,.42),transparent);opacity:0}.inkshine.show{animation:inkline 2.8s 2.2s ease forwards}

#level4{text-align:center;background:radial-gradient(circle at 50% 72%,#21170c,#030303 65%)}.crane{position:relative;width:min(52vw,390px);height:175px;margin:auto;color:var(--gold);opacity:.95;animation:craneFloat 3.2s ease-in-out infinite}.mast{position:absolute;left:45%;bottom:0;width:9px;height:132px;background:linear-gradient(#ffe49a,#9b742b);transform:translateX(-50%);box-shadow:0 0 12px rgba(216,181,108,.18)}.boomarm{position:absolute;left:45%;top:25px;width:74%;height:7px;background:linear-gradient(90deg,#8f681f,#ffe5a2,#8f681f);transform-origin:0 50%;animation:armSway 4.1s ease-in-out infinite}.boomarm:before{content:"";position:absolute;left:0;top:-22px;width:42%;height:28px;border-left:2px solid var(--gold);border-top:2px solid var(--gold);transform:skewX(-32deg)}.hook{position:absolute;left:78%;top:31px;width:1px;height:72px;background:var(--gold);animation:hookBob 2.1s ease-in-out infinite}.hook:after{content:"";position:absolute;bottom:-11px;left:-5px;width:10px;height:10px;border:2px solid var(--gold);border-top:0;border-radius:0 0 8px 8px}.block{position:absolute;left:calc(78% - 18px);top:105px;width:36px;height:20px;border:1px solid rgba(255,226,161,.75);background:rgba(216,181,108,.12);animation:blockBob 2.1s ease-in-out infinite}.buildspark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold2);opacity:0}.buildspark.s1{left:28%;bottom:18%;animation:sparkPop 1.7s infinite}.buildspark.s2{left:60%;bottom:7%;animation:sparkPop 1.7s .55s infinite}.buildspark.s3{left:72%;bottom:21%;animation:sparkPop 1.7s 1.05s infinite}#level4 h2{font:500 clamp(2.2rem,8vw,5rem) Georgia;color:var(--gold2);letter-spacing:.12em;text-shadow:0 0 28px rgba(216,181,108,.24)}#level4 p{color:var(--gold);letter-spacing:.25em;font-size:.8rem}
@keyframes grain{to{transform:translate3d(3%,2%,0)}}@keyframes draw{to{width:min(78vw,540px)}}@keyframes auth{0%{opacity:0}28%,68%{opacity:1}100%{opacity:0}}@keyframes logo{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes entry{to{opacity:1;transform:none}}@keyframes countHit{0%{opacity:0;filter:blur(18px);transform:scale(.38)}20%{opacity:1;filter:blur(0);transform:scale(1.22)}34%{transform:translate(calc(var(--shake)*-1),var(--shake)) scale(1.12)}43%{transform:translate(var(--shake),calc(var(--shake)*-.7)) scale(1.08)}52%{transform:translate(calc(var(--shake)*-.65),calc(var(--shake)*.45)) scale(1.05)}63%{transform:translate(calc(var(--shake)*.4),calc(var(--shake)*-.3)) scale(1.03)}100%{opacity:1;transform:translate(0,0) scale(1)}}@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.45)}}@keyframes blast{0%{opacity:0;transform:translateY(22%) scale(.72)}13%{opacity:1;transform:translateY(0) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:translateY(-4%) scale(.98)}}@keyframes blastR{0%{opacity:0;transform:scaleX(-1) translateY(22%) scale(.72)}13%{opacity:1;transform:scaleX(-1) translateY(0) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:scaleX(-1) translateY(-4%) scale(.98)}}@keyframes glow{0%,100%{opacity:0}15%,70%{opacity:1}}@keyframes unrollVertical{0%{opacity:0;clip-path:inset(49% 0 49% 0);transform:translate(-50%,-50%) rotate(-2.2deg) scale(.84)}14%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);transform:translate(-50%,-50%) rotate(-2.2deg) scale(1)}}@keyframes sealSubtle{to{opacity:.72;transform:translate(-50%,-50%) scale(1) rotate(2deg)}}@keyframes ink{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes inkName{0%{opacity:0;clip-path:inset(0 100% 0 0)}12%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes craneFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}@keyframes armSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}@keyframes hookBob{0%,100%{height:62px;transform:translateX(0)}50%{height:78px;transform:translateX(7px)}}@keyframes blockBob{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(7px,16px) rotate(3deg)}}@keyframes sparkPop{0%,55%,100%{opacity:0;transform:translate(0,0) scale(.4)}60%{opacity:1;transform:translate(-5px,-6px) scale(1)}75%{opacity:.7;transform:translate(8px,-14px) scale(.7)}}@keyframes dhFloat{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:.38}70%{opacity:.22}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}@keyframes inkline{0%{opacity:0;transform:scaleX(.2)}40%{opacity:.55}100%{opacity:0;transform:scaleX(1)}}@keyframes fadeIn{to{opacity:1}}@keyframes dhGlow{12%{opacity:.18}48%{opacity:.58}100%{opacity:.08}}
@media(max-width:700px){.scroll-shell{width:min(76vw,330px);top:49%}.seal{top:24%;width:38px}.guesttitle{top:39%;font-size:clamp(1.85rem,9vw,3.1rem)}.guestnames{top:52%;font-size:clamp(.95rem,4.3vw,1.35rem);gap:.42rem}.portrait{width:22vw}.fire{width:56vw;height:78vh}.fire.left{left:-18vw}.fire.right{right:-18vw}.crane{width:min(78vw,340px)}}

</head><body><main id="app"><canvas id="fx"></canvas><canvas id="fw"></canvas><div class="grain"></div><div class="vignette"></div><div id="flash" class="flash"></div>
<section id="boot" class="screen active"><div><div id="bootLine" class="line"></div><div id="bootAuth" class="authorized">AUTHORIZED</div><h1 id="bootLogo" class="logo">DE ONTHULLING</h1><p id="bootSub" class="sub" style="opacity:0">LEVEL 3</p><button id="open" class="start">OPEN LEVEL</button><p id="hint" class="hint">Zet je geluid aan voor de volledige ervaring.</p></div></section>
<section id="protocol" class="screen"><div class="protocol"><p class="kicker">THE REVEAL PROTOCOL</p><div id="log" class="log"></div><div class="bar-shell"><div id="bar" class="bar"></div></div></div></section>
<section id="countdown" class="screen"><div id="ring" class="ring"></div><div><p class="kicker">LEVEL WORDT VRIJGEGEVEN</p><div id="count" class="count">3</div></div></section>
<section id="fireScene" class="screen"><div class="fire-wrap"><video id="fireL" class="fire left" src="fire.mp4" muted playsinline preload="auto"></video><video id="fireR" class="fire right" src="fire.mp4" muted playsinline preload="auto"></video><div id="stageGlow" class="stage-glow"></div></div></section>
<section id="guestScene" class="screen"><div id="scroll" class="scroll-shell"><img src="parchment.png" alt="Oude perkamentrol"><img id="seal" class="seal" src="dh-seal.png" alt="DH-zegel"><div id="guestTitle" class="guesttitle">Gastenlijst</div><div id="guestNames" class="guestnames"><div class="guestname">Tanja Paksvan</div><div class="guestname">Cynthia Schoonbrood</div><div class="guestname">Niels van der Veen</div></div><div id="inkshine" class="inkshine"></div></div></section>
<section id="finale" class="screen"><div id="dhField" class="dhfield"></div><div id="dh" class="dhhidden">DH</div><div id="finalText" class="finaltext">..We willen dat je bij ons bent als de Show begint..</div></section>
<section id="level4" class="screen"><div><div class="crane"><span class="mast"></span><span class="boomarm"></span><span class="hook"></span><span class="block"></span><span class="buildspark s1"></span><span class="buildspark s2"></span><span class="buildspark s3"></span></div><h2>LEVEL 4</h2><p>ER WORDT AAN GEBOUWD...</p></div></section>
</main><script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));const screens=[...document.querySelectorAll('.screen')];function show(id){screens.forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
let ac;function audio(){ac??=new(window.AudioContext||window.webkitAudioContext)();return ac}function tone(freq,dur,type='sine',gain=.1,delay=0,endFreq=null){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+delay);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,a.currentTime+delay+dur);g.gain.setValueAtTime(.0001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,a.currentTime+delay+.018);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+.02)}function noise(dur=.8,gain=.18,delay=0,cut=1200,highpass=0){const a=audio(),b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const src=a.createBufferSource(),g=a.createGain(),lp=a.createBiquadFilter(),hp=a.createBiquadFilter();src.buffer=b;lp.type='lowpass';lp.frequency.value=cut;hp.type='highpass';hp.frequency.value=highpass;g.gain.value=gain;src.connect(lp).connect(hp).connect(g).connect(a.destination);src.start(a.currentTime+delay)}function boom(){noise(1.7,.5,0,820);tone(43,1.55,'sine',.42,0,30);tone(73,.8,'triangle',.12,0,48)}function countImpact(power=1){const g=.12+.055*power;noise(.62,.13+.05*power,0,2100,110);tone(78-power*8,.52,'sine',g,0,48-power*4);tone(410+power*35,.24,'triangle',.035+.012*power,.02,260);for(let i=0;i<7+power*4;i++)tone(1450+Math.random()*1800,.1,'sine',.006+.002*power,.05+Math.random()*.28)}function fireWhoosh(){noise(1.1,.34,0,2600);tone(115,.65,'sawtooth',.055)}function fireworkSound(){for(let i=0;i<10;i++){const d=i*.5+Math.random()*.14;noise(.82,.26,d,1350);tone(48+Math.random()*62,.78,'sine',.19,d,34);for(let j=0;j<14;j++)tone(1100+Math.random()*2800,.13,'square',.009,d+.08+Math.random()*.62)}}function constructionTune(){const a=audio(),start=a.currentTime+.05;for(let i=0;i<8;i++){const d=i*.62;noise(.12,.11,d,4200,850);tone(i%2?560:430,.13,'triangle',.035,d);if(i%2===1)tone(95,.22,'sine',.07,d+.12,72)}for(let i=0;i<3;i++){const d=.3+i*1.7;noise(.58,.055,d,5200,1300);tone(150,.48,'sawtooth',.016,d,230)}}function flash(){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
const positions=[[4,12],[82,11],[2,58],[84,58],[14,76],[72,76],[18,0],[67,0],[43,77]];for(let i=1;i<=9;i++){const img=new Image();img.className='portrait';img.src=String(i).padStart(2,'0')+'.jpg';img.style.left=positions[i-1][0]+'%';img.style.top=positions[i-1][1]+'%';$('#guestScene').appendChild(img)}
async function blastFire(){const vids=[$('#fireL'),$('#fireR')],glow=$('#stageGlow');for(const v of vids){v.pause();v.currentTime=0;v.classList.remove('blast');void v.offsetWidth;v.classList.add('blast');v.play().catch(()=>{})}glow.classList.remove('on');void glow.offsetWidth;glow.classList.add('on');fireWhoosh();if(navigator.vibrate)navigator.vibrate([80,25,110]);await sleep(1550)}
function countBurst(power){for(let b=0;b<power;b++){const cx=innerWidth*(.36+Math.random()*.28),cy=innerHeight*(.30+Math.random()*.34);burstAt(cx,cy,42+power*12,1.2+power*.28)}if(!fw)draw()}function spawnMiniDH(){const f=$('#dhField');const el=document.createElement('span');el.className='dhmini';el.textContent='DH';el.style.left=(8+Math.random()*84)+'%';el.style.top=(10+Math.random()*76)+'%';el.style.transform='rotate('+(Math.random()*24-12)+'deg)';f.appendChild(el);setTimeout(()=>el.remove(),3800)}
async function run(){show('#protocol');const steps=[['Protocol gestart...',18],['Beveiligde verbinding opgebouwd...',38],['Authenticatie voltooid.',58],['Nieuw level gedetecteerd.',78],['Level 3 wordt vrijgegeven...',100]];for(const [text,p] of steps){const e=document.createElement('div');e.className='entry';e.textContent=text;$('#log').appendChild(e);requestAnimationFrame(()=>e.classList.add('show'));$('#bar').style.width=p+'%';tone(420+p*1.25,.10,'triangle',.022);await sleep(1030)}await sleep(350);show('#countdown');let power=1;for(const n of [3,2,1]){const c=$('#count');c.textContent=n;c.className='count hit power'+n;void c.offsetWidth;c.classList.add('hit');countImpact(power);countBurst(power);if(n===1&&navigator.vibrate)navigator.vibrate([90,35,130,35,180]);else if(n===2&&navigator.vibrate)navigator.vibrate([60,25,85]);else if(n===3&&navigator.vibrate)navigator.vibrate(45);await sleep(1550);power++}flash();boom();countBurst(4);await sleep(300);show('#fireScene');await blastFire();await sleep(160);await blastFire();await sleep(120);await blastFire();await sleep(480);show('#guestScene');$('#scroll').classList.add('open');await sleep(2450);$('#seal').classList.add('show');await sleep(900);$('#guestTitle').classList.add('write');$('#inkshine').classList.add('show');await sleep(3650);for(const n of document.querySelectorAll('.guestname')){n.classList.add('write');await sleep(1300)}await sleep(500);const pics=[...document.querySelectorAll('.portrait')];for(const p of pics){p.classList.add('show');countImpact(.15);await sleep(2850);p.classList.add('hide');await sleep(650)}await sleep(700);show('#finale');startFireworks();fireworkSound();const dhTimer=setInterval(spawnMiniDH,480);$('#dh').classList.add('on');await sleep(1300);$('#finalText').classList.add('on');await sleep(7600);clearInterval(dhTimer);stopFireworks();show('#level4');constructionTune()}
setTimeout(()=>{$('#bootLine').classList.add('draw');$('#bootAuth').classList.add('show');setTimeout(()=>$('#bootLogo').classList.add('show'),900);setTimeout(()=>{$('#bootSub').style.transition='opacity 1s';$('#bootSub').style.opacity=1},2300);setTimeout(()=>{$('#open').classList.add('ready');$('#hint').classList.add('show')},3500)},250);$('#open').addEventListener('click',async()=>{await audio().resume();$('#open').disabled=true;run()});
const c=$('#fw'),ctx=c.getContext('2d');let parts=[],fw=false,timer;function size(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function burstAt(cx,cy,count=115,scale=1){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=(1.2+Math.random()*5.4)*scale;parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:.55+Math.random()*1.75})}}function burst(){burstAt(innerWidth*(.12+Math.random()*.76),innerHeight*(.13+Math.random()*.48),115,1)}function startFireworks(){fw=true;burst();timer=setInterval(()=>fw&&burst(),620);draw()}function stopFireworks(){fw=false;clearInterval(timer)}function draw(){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,innerWidth,innerHeight);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.life-=.013;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=Math.random()>.18?'#ffd978':'#fff3c4';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}parts=parts.filter(p=>p.life>0);ctx.globalAlpha=1;if(fw||parts.length)requestAnimationFrame(draw)}
