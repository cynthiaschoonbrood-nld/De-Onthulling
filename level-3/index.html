<style>

/* perkament — horizontale rol uit de gekozen visuele referentie */
#guestScene{background:radial-gradient(ellipse at center,rgba(59,38,18,.42) 0,#080503 58%,#000 100%)}.scroll-shell{position:absolute;left:50%;top:49%;width:min(72vw,720px);transform:translate(-50%,-50%) rotate(-1.2deg) scale(.92);filter:drop-shadow(0 28px 38px rgba(0,0,0,.82));clip-path:inset(49% 0 49% 0);opacity:0;transform-origin:center}.scroll-shell.open{animation:unrollVertical 2.35s cubic-bezier(.18,.82,.18,1) forwards}.scroll-shell>img:first-child{width:100%;display:block}.seal{position:absolute;left:50%;top:19%;width:clamp(25px,3.1vw,39px);transform:translate(-50%,-50%) scale(.76) rotate(1deg);opacity:0;mix-blend-mode:multiply;filter:sepia(.75) saturate(.55) brightness(.62) contrast(1.05);}.seal.show{animation:sealSubtle 1.15s ease forwards}.guesttitle{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:italic clamp(2rem,4.6vw,4rem) "Segoe Script","Brush Script MT",cursive;color:#17100b;white-space:nowrap;text-shadow:none;clip-path:inset(0 100% 0 0);opacity:0}.guesttitle.write{animation:ink 3.7s cubic-bezier(.25,.05,.2,1) forwards}.guestnames{position:absolute;left:50%;top:53%;width:76%;transform:translateX(-50%);display:grid;gap:.38rem;text-align:center;color:#17100b;font:italic clamp(1.02rem,2.15vw,1.72rem) "Segoe Script","Brush Script MT",cursive}.guestname{opacity:0;clip-path:inset(0 100% 0 0)}.guestname.write{animation:inkName 1.9s cubic-bezier(.25,.05,.2,1) forwards}.inkshine{position:absolute;left:29%;right:29%;top:46%;height:1px;background:linear-gradient(90deg,transparent,rgba(20,13,8,.45),transparent);opacity:0}.inkshine.show{animation:inkline 2.8s 2.2s ease forwards}
.portrait{position:absolute;width:clamp(78px,12vw,145px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,226,161,.8);box-shadow:0 0 25px rgba(216,181,108,.45),0 14px 28px rgba(0,0,0,.65);opacity:0;filter:blur(18px);transform:scale(.7);transition:opacity 1.15s ease,filter 1.45s ease,transform 1.45s ease}.portrait.show{opacity:1;filter:blur(0);transform:scale(1)}.portrait.hide{opacity:0;filter:blur(14px);transform:scale(.78)}
#finale{background:radial-gradient(circle at 50% 50%,rgba(42,28,8,.12),rgba(1,1,1,.28) 62%,rgba(0,0,0,.46) 100%)}.dhfield{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.dhmini{position:absolute;color:rgba(255,221,137,.72);font:700 clamp(.7rem,1.8vw,1.25rem) Georgia;text-shadow:0 0 10px rgba(255,214,105,.55);animation:dhFloat 3.6s ease-out forwards}.finaltext{position:relative;z-index:4;text-align:center;color:var(--gold2);font:italic clamp(1.5rem,5vw,3.8rem) Georgia;max-width:900px;padding:2rem;opacity:0;text-shadow:0 0 24px rgba(255,226,161,.42),0 0 68px rgba(216,181,108,.25)}.finaltext.on{animation:fadeIn 1.8s forwards}.dhhidden{position:absolute;z-index:3;font:700 clamp(4rem,16vw,10rem) Georgia;color:var(--gold);opacity:0;text-shadow:0 0 40px #ffd87a}.dhhidden.on{animation:dhGlow 5s forwards}
#level4{text-align:center;background:radial-gradient(circle at 50% 72%,#21170c,#030303 65%)}.crane{position:relative;width:min(52vw,390px);height:175px;margin:auto;color:var(--gold);opacity:.95;animation:craneFloat 3.2s ease-in-out infinite}.mast{position:absolute;left:45%;bottom:0;width:9px;height:132px;background:linear-gradient(#ffe49a,#9b742b);transform:translateX(-50%);box-shadow:0 0 12px rgba(216,181,108,.18)}.boomarm{position:absolute;left:45%;top:25px;width:74%;height:7px;background:linear-gradient(90deg,#8f681f,#ffe5a2,#8f681f);transform-origin:0 50%;animation:armSway 4.1s ease-in-out infinite}.boomarm:before{content:"";position:absolute;left:0;top:-22px;width:42%;height:28px;border-left:2px solid var(--gold);border-top:2px solid var(--gold);transform:skewX(-32deg)}.hook{position:absolute;left:78%;top:31px;width:1px;height:72px;background:var(--gold);animation:hookBob 2.1s ease-in-out infinite}.hook:after{content:"";position:absolute;bottom:-11px;left:-5px;width:10px;height:10px;border:2px solid var(--gold);border-top:0;border-radius:0 0 8px 8px}.block{position:absolute;left:calc(78% - 18px);top:105px;width:36px;height:20px;border:1px solid rgba(255,226,161,.75);background:rgba(216,181,108,.12);animation:blockBob 2.1s ease-in-out infinite}.buildspark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold2);opacity:0}.buildspark.s1{left:28%;bottom:18%;animation:sparkPop 1.7s infinite}.buildspark.s2{left:60%;bottom:7%;animation:sparkPop 1.7s .55s infinite}.buildspark.s3{left:72%;bottom:21%;animation:sparkPop 1.7s 1.05s infinite}#level4 h2{font:500 clamp(2.2rem,8vw,5rem) Georgia;color:var(--gold2);letter-spacing:.12em;text-shadow:0 0 28px rgba(216,181,108,.24)}#level4 p{color:var(--gold);letter-spacing:.25em;font-size:.8rem}
@keyframes grain{to{transform:translate3d(3%,2%,0)}}@keyframes draw{to{width:min(78vw,540px)}}@keyframes auth{0%{opacity:0}28%,68%{opacity:1}100%{opacity:0}}@keyframes logo{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes entry{to{opacity:1;transform:none}}@keyframes countHit{0%{opacity:0;filter:blur(18px);transform:scale(.38)}20%{opacity:1;filter:blur(0);transform:scale(1.22)}34%{transform:translate(calc(var(--shake)*-1),var(--shake)) scale(1.12)}43%{transform:translate(var(--shake),calc(var(--shake)*-.7)) scale(1.08)}52%{transform:translate(calc(var(--shake)*-.65),calc(var(--shake)*.45)) scale(1.05)}63%{transform:translate(calc(var(--shake)*.4),calc(var(--shake)*-.3)) scale(1.03)}100%{opacity:1;transform:translate(0,0) scale(1)}}@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.45)}}@keyframes blast{0%{opacity:0;transform:translateY(22%) scale(.72)}13%{opacity:1;transform:translateY(0) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:translateY(-4%) scale(.98)}}@keyframes blastR{0%{opacity:0;transform:scaleX(-1) translateY(22%) scale(.72)}13%{opacity:1;transform:scaleX(-1) translateY(0) scale(1.1)}72%{opacity:1}100%{opacity:0;transform:scaleX(-1) translateY(-4%) scale(.98)}}@keyframes glow{0%,100%{opacity:0}15%,70%{opacity:1}}@keyframes unrollVertical{0%{opacity:0;clip-path:inset(49% 0 49% 0);transform:translate(-50%,-50%) rotate(-1.2deg) scale(.86)}14%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0);transform:translate(-50%,-50%) rotate(-1.2deg) scale(1)}}@keyframes sealSubtle{to{opacity:.72;transform:translate(-50%,-50%) scale(1) rotate(2deg)}}@keyframes ink{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes inkName{0%{opacity:0;clip-path:inset(0 100% 0 0)}12%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes craneFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}@keyframes armSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}@keyframes hookBob{0%,100%{height:62px;transform:translateX(0)}50%{height:78px;transform:translateX(7px)}}@keyframes blockBob{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(7px,16px) rotate(3deg)}}@keyframes sparkPop{0%,55%,100%{opacity:0;transform:translate(0,0) scale(.4)}60%{opacity:1;transform:translate(-5px,-6px) scale(1)}75%{opacity:.7;transform:translate(8px,-14px) scale(.7)}}@keyframes dhFloat{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:.38}70%{opacity:.22}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}@keyframes inkline{0%{opacity:0;transform:scaleX(.2)}40%{opacity:.55}100%{opacity:0;transform:scaleX(1)}}@keyframes fadeIn{to{opacity:1}}@keyframes dhGlow{12%{opacity:.18}48%{opacity:.58}100%{opacity:.08}}
@media(max-width:700px){.scroll-shell{width:min(92vw,620px);top:49%}.seal{top:19%;width:26px}.guesttitle{top:38%;font-size:clamp(1.7rem,8.5vw,2.8rem)}.guestnames{top:53%;font-size:clamp(.82rem,3.7vw,1.15rem);gap:.26rem}.portrait{width:20vw}.fire{width:56vw;height:78vh}.fire.left{left:-18vw}.fire.right{right:-18vw}.construction-wrap{width:96vw}}

#level4{background:radial-gradient(ellipse at 50% 72%,rgba(70,47,18,.28),#090704 48%,#010101 82%);overflow:hidden}

.crane-svg{width:100%;height:100%;overflow:visible}.crane-metal{stroke:#d8b56c;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.crane-thin{stroke:#b88e3e;stroke-width:2;fill:none;opacity:.92}.crane-dark{fill:#171009;stroke:#b88e3e;stroke-width:2}.work-light{fill:#ffe2a1;filter:drop-shadow(0 0 8px #ffd777)}

</main><script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));const screens=[...document.querySelectorAll('.screen')];function show(id){screens.forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
let ac;function audio(){ac??=new(window.AudioContext||window.webkitAudioContext)();return ac}function tone(freq,dur,type='sine',gain=.1,delay=0,endFreq=null){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+delay);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,a.currentTime+delay+dur);g.gain.setValueAtTime(.0001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,a.currentTime+delay+.018);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur+.02)}function noise(dur=.8,gain=.18,delay=0,cut=1200,highpass=0){const a=audio(),b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const src=a.createBufferSource(),g=a.createGain(),lp=a.createBiquadFilter(),hp=a.createBiquadFilter();src.buffer=b;lp.type='lowpass';lp.frequency.value=cut;hp.type='highpass';hp.frequency.value=highpass;g.gain.value=gain;src.connect(lp).connect(hp).connect(g).connect(a.destination);src.start(a.currentTime+delay)}function boom(){noise(1.7,.5,0,820);tone(43,1.55,'sine',.42,0,30);tone(73,.8,'triangle',.12,0,48)}function countImpact(power=1){const g=.12+.055*power;noise(.62,.13+.05*power,0,2100,110);tone(78-power*8,.52,'sine',g,0,48-power*4);tone(410+power*35,.24,'triangle',.035+.012*power,.02,260);for(let i=0;i<7+power*4;i++)tone(1450+Math.random()*1800,.1,'sine',.006+.002*power,.05+Math.random()*.28)}function fireWhoosh(){noise(1.1,.34,0,2600);tone(115,.65,'sawtooth',.055)}function fireworkSound(){for(let i=0;i<10;i++){const d=i*.5+Math.random()*.14;noise(.82,.26,d,1350);tone(48+Math.random()*62,.78,'sine',.19,d,34);for(let j=0;j<14;j++)tone(1100+Math.random()*2800,.13,'square',.009,d+.08+Math.random()*.62)}}function pageTurn(){const a=audio(),t=a.currentTime;noise(.34,.075,0,4200,550);noise(.22,.045,.12,2600,850);tone(165,.18,'triangle',.018,.16,115)}function sawSound(delay=0){for(let i=0;i<12;i++){const d=delay+i*.18;noise(.22,.08,d,5200,700);tone(118+Math.random()*12,.20,'sawtooth',.022,d,102)}noise(2.35,.055,delay,6500,1000)}function sandSound(delay=0){for(let i=0;i<9;i++){const d=delay+i*.22;noise(.24,.065,d,3200,500);noise(.11,.03,d+.09,5200,1300)}}function hammerSound(delay=0){for(let i=0;i<6;i++){const d=delay+i*.47;noise(.12,.16,d,1800,80);tone(115,.18,'triangle',.09,d,62);tone(760,.12,'sine',.025,d+.015,510)}}function constructionTune(){sawSound(0);sandSound(2.7);hammerSound(5.4)}function flash(){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}

const c=$('#fw'),ctx=c.getContext('2d');let parts=[],fw=false,timer;function size(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function burstAt(cx,cy,count=115,scale=1){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=(1.2+Math.random()*5.4)*scale;parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:.55+Math.random()*1.75})}}function burst(){burstAt(innerWidth*(.12+Math.random()*.76),innerHeight*(.13+Math.random()*.48),115,1)}function startFireworks(){fw=true;burst();timer=setInterval(()=>fw&&burst(),620);draw()}function stopFireworks(){fw=false;clearInterval(timer)}function draw(){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,innerWidth,innerHeight);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.life-=.013;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=Math.random()>.18?'#ffd978':'#fff3c4';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}parts=parts.filter(p=>p.life>0);ctx.globalAlpha=1;if(fw||parts.length)requestAnimationFrame(draw)}
